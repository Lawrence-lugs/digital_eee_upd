function onInputVarChange(key, rawVal, inputEl) {
  if (!rawVal || rawVal === '-') return;
  const val = parseInBase(rawVal, getVarBase(key), varBits[key] ?? varBitDefault);
  if (val === null) return; // not a valid integer yet
  const prev = userVars[key];
  userVars[key] = val;
  prevSimVars = { ...simVars };
  simVars[key] = val;
  // Log input changes so students can see what triggered a path change
  if (simStep > 0 && prev !== val) {
    addLog('output', `  ✎ input ${key}: ${prev} → ${val}`);
  }
  traceAsmBlock();
  evalCombinationalPath();
  render();
  const oorBefore = bitRangeVarNames.has(key);
  checkBitRanges();
  const oorAfter = bitRangeVarNames.has(key);
  if (oorBefore !== oorAfter) {
    refreshPanels();
  } else {
    // Don't fully re-render (would kill focus); just update display values
    updateVarDisplayValues();
    if (activeTab === 'log') renderLogPanel();
  }
}

function setCombDefault(key, rawVal, inputEl) {
  if (!rawVal || rawVal === '-') return;
  const val = parseInBase(rawVal, getVarBase(key), varBits[key] ?? varBitDefault);
  if (val === null) return;
  combDefaults[key] = val;
  prevSimVars = {};
  lastWrittenVars = new Set();
  // Re-evaluate immediately so the var reflects new default if off-path
  traceAsmBlock(); evalCombinationalPath(); render();
  updateVarDisplayValues();
}

// Parse a string as an integer (supports negatives). Returns null if incomplete/invalid.
function parseIntSafe(s) {
  s = String(s).trim();
  if (s === '' || s === '-') return null;
  const n = parseInt(s, 10);
  if (isNaN(n)) return null;
  // Ensure no decimal / extra chars
  if (String(n) !== s && '-'+String(Math.abs(n)) !== s) return null;
  return n;
}

function stripLineComment(stmt) {
  const idx = stmt.indexOf('//');
  return idx >= 0 ? stmt.slice(0, idx) : stmt;
}

function splitCodeStatements(code, options = {}) {
  return normalizeCode(code, options)
    .split(/[\n;]+/)
    .map(stripLineComment)
    .map(s => s.trim())
    .filter(Boolean);
}

function parseAssignmentStatement(stmt) {
  const m = stmt.match(/^([A-Za-z_$][A-Za-z0-9_$]*)\s*(=|\+=|-=|\*=|&=|\|=|\^=|<<=|>>=|>>>=)\s*(.+)$/);
  if (!m) return null;
  return { lhs:m[1], op:m[2], rhs:m[3].trim(), raw:stmt };
}

function ensureIntegerResult(value, stmt, blockType) {
  if (!Number.isFinite(value) || !Number.isInteger(value)) {
    throw new Error(`${blockType === 'state' ? 'State box' : 'Assignment'} must produce an integer: ${stmt}`);
  }
}

// Pre-process Verilog-style bit operations into JavaScript equivalents.
// A[7:0]  → ((A >>> 0) & 0xFF)
// A[4]    → ((A >>> 4) & 1)
// {A,B,C} → ((A << totalShift) | ((B & mask) << shift) | (C & mask))
//            using varBits[name] ?? varBitDefault for each part's width
function preprocessBitExpr(expr) {
  // Helper: width of a concat part (may contain slice notation)
  function _partWidth(part) {
    let m = part.match(/^[A-Za-z_$][A-Za-z0-9_$]*\[(\d+):(\d+)\]$/);
    if (m) return parseInt(m[1], 10) - parseInt(m[2], 10) + 1;
    m = part.match(/^[A-Za-z_$][A-Za-z0-9_$]*\[(\d+)\]$/);
    if (m) return 1;
    if (/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(part)) return varBits[part] ?? varBitDefault;
    return varBitDefault;
  }
  // Helper: convert one concat part to a JS sub-expression
  function _partToJS(part) {
    let m = part.match(/^([A-Za-z_$][A-Za-z0-9_$]*)\[(\d+):(\d+)\]$/);
    if (m) {
      const loN = parseInt(m[3], 10), width = parseInt(m[2], 10) - loN + 1;
      const mask = width >= 32 ? 0xFFFFFFFF : (1 << width) - 1;
      return `((${m[1]} >>> ${loN}) & ${mask})`;
    }
    m = part.match(/^([A-Za-z_$][A-Za-z0-9_$]*)\[(\d+)\]$/);
    if (m) return `((${m[1]} >>> ${parseInt(m[2], 10)}) & 1)`;
    return part;
  }

  // Process concatenation FIRST so we can detect slice widths before they get replaced
  expr = expr.replace(/\{([^}]+)\}/g, (_m, inner) => {
    const parts = inner.split(',').map(p => p.trim()).filter(Boolean);
    if (parts.length === 0) return '0';
    if (parts.length === 1) return _partToJS(parts[0]);
    let result = '', shift = 0;
    for (let i = parts.length - 1; i >= 0; i--) {
      const bw = _partWidth(parts[i]);
      const jsE = _partToJS(parts[i]);
      const mask = bw >= 32 ? 0xFFFFFFFF : (1 << bw) - 1;
      if (i === parts.length - 1) {
        result = `(${jsE} & ${mask})`;
      } else if (i === 0) {
        result = `((${jsE} << ${shift}) | ${result})`;
      } else {
        result = `(((${jsE} & ${mask}) << ${shift}) | ${result})`;
      }
      shift += bw;
    }
    return result;
  });

  // Bit slice: VARNAME[hi:lo]
  expr = expr.replace(/([A-Za-z_$][A-Za-z0-9_$]*)\[(\d+):(\d+)\]/g, (_m, name, hi, lo) => {
    const hiN = parseInt(hi, 10), loN = parseInt(lo, 10);
    const width = hiN - loN + 1;
    const mask = width >= 32 ? 0xFFFFFFFF : (1 << width) - 1;
    return `((${name} >>> ${loN}) & ${mask})`;
  });
  // Single bit: VARNAME[n]
  expr = expr.replace(/([A-Za-z_$][A-Za-z0-9_$]*)\[(\d+)\]/g, (_m, name, bit) => {
    return `((${name} >>> ${parseInt(bit, 10)}) & 1)`;
  });

  // Verilog shift convention: >> = logical (fill 0), >>> = arithmetic (sign-extend)
  // JS is opposite: >> = arithmetic, >>> = logical — so swap them
  expr = expr.replace(/>>>/g, '__ARITH__');
  expr = expr.replace(/>>/g, '>>>');        // user >> (logical)  → JS >>> (logical)
  expr = expr.replace(/__ARITH__/g, '>>'); // user >>> (arith)   → JS >>  (arithmetic)

  return expr;
}

function evalExprInScope(expr, scope) {
  const names = Object.keys(scope);
  const vals = Object.values(scope);
  const processed = preprocessBitExpr(expr);
  return (new Function(...names, 'return (' + processed + ');'))(...vals);
}

function applyCompoundAssignment(oldVal, op, rhsVal) {
  switch (op) {
    case '=':   return rhsVal;
    case '+=':  return oldVal + rhsVal;
    case '-=':  return oldVal - rhsVal;
    case '*=':  return oldVal * rhsVal;

    case '&=':  return oldVal & rhsVal;
    case '|=':  return oldVal | rhsVal;
    case '^=':  return oldVal ^ rhsVal;
    case '<<=':  return oldVal << rhsVal;
    case '>>=':  return oldVal >>> rhsVal;  // Verilog >> = logical (fill 0)
    case '>>>=': return oldVal >> rhsVal;   // Verilog >>> = arithmetic (sign-extend)
    default:    return rhsVal;
  }
}

function evaluateAssignmentBlock(code, baseScope, options = {}) {
  const writes = [];
  const assignedCounts = {};

  const blockType = options.blockType || '';

  // output/conditional boxes use combinational settling
  const isConditional = blockType === 'output';

  // working scope
  const scope = { ...baseScope };

  const statements = splitCodeStatements(code, options);

  // STATE BOXES
  // concurrent semantics (your old behavior)
  if (!isConditional) {

    statements.forEach(stmt => {
      const parsed = parseAssignmentStatement(stmt);
      if (!parsed) return;

      const lhs = parsed.lhs;

      const oldVal = lhs in baseScope ? baseScope[lhs] : 0;

      const rhsVal = evalExprInScope(parsed.rhs, baseScope);

      const value = applyCompoundAssignment(
        oldVal,
        parsed.op,
        rhsVal
      );

      ensureIntegerResult(value, parsed.raw, blockType);

      writes.push({
        varName: lhs,
        value,
        raw: parsed.raw
      });

      assignedCounts[lhs] =
        (assignedCounts[lhs] || 0) + 1;
    });

  }

// CONDITIONAL / OUTPUT BOXES
// combinational fixed-point evaluation
else {

  // count assignments ONCE
  statements.forEach(stmt => {
    const parsed = parseAssignmentStatement(stmt);
    if (!parsed) return;

    assignedCounts[parsed.lhs] =
      (assignedCounts[parsed.lhs] || 0) + 1;
  });

  // Dependency-graph cycle detection for combinational vars
  {
    const combDeps = {}; // lhs -> [dep var names that are also comb-assigned here]
    statements.forEach(stmt => {
      const parsed = parseAssignmentStatement(stmt);
      if (!parsed || isRegisterVar(parsed.lhs)) return;
      combDeps[parsed.lhs] = (parsed.rhs.match(/\b[A-Za-z_$][A-Za-z0-9_$]*\b/g) || []);
    });
    const combLhs = new Set(Object.keys(combDeps));
    const GRAY = 1, BLACK = 2;
    const color = {};
    let cycleNodes = null;
    const dfsCycle = (u, path) => {
      color[u] = GRAY;
      for (const v of combDeps[u]) {
        if (!combLhs.has(v)) continue;
        if (color[v] === GRAY) {
          const idx = path.indexOf(v);
          cycleNodes = [...path.slice(idx), v];
          return true;
        }
        if (color[v] !== BLACK && dfsCycle(v, [...path, v])) return true;
      }
      color[u] = BLACK;
      return false;
    };
    for (const node of combLhs) {
      if (!color[node] && dfsCycle(node, [node])) break;
    }
    if (cycleNodes) {
      throw new Error(`Circular combinational assignment: ${cycleNodes.join(' → ')} forms a cycle.`);
    }
  }

  let changed = true;
  let iter = 0;
  const MAX_ITER = 32;

  while (changed && iter < MAX_ITER) {
    changed = false;
    iter++;

    statements.forEach(stmt => {

      const parsed = parseAssignmentStatement(stmt);
      if (!parsed) return;

      const lhs = parsed.lhs;

      const oldVal =
        lhs in scope ? scope[lhs] : 0;

      const rhsVal =
        evalExprInScope(parsed.rhs, scope);

      const value =
        applyCompoundAssignment(
          oldVal,
          parsed.op,
          rhsVal
        );

      // REGISTER VARIABLE
      if (isRegisterVar(lhs)) {

        let existing =
          writes.find(w => w.varName === lhs);

        if (existing) {
          existing.value = value;
        } else {
          writes.push({
            varName: lhs,
            value,
            raw: parsed.raw
          });
        }

      }

      // COMBINATIONAL VARIABLE
      else {

        if (scope[lhs] !== value) {
          scope[lhs] = value;
          changed = true;
        }

        let existing =
          writes.find(w => w.varName === lhs);

        if (existing) {
          existing.value = value;
        } else {
          writes.push({
            varName: lhs,
            value,
            raw: parsed.raw
          });
        }
      }

    });

  }

  // Circular combinational assignment: fixed-point didn't converge
  if (changed && iter >= MAX_ITER) {
    const circularVars = [];
    statements.forEach(stmt => {
      const parsed = parseAssignmentStatement(stmt);
      if (!parsed || isRegisterVar(parsed.lhs)) return;
      const rhsNames = (parsed.rhs.match(/\b[A-Za-z_$][A-Za-z0-9_$]*\b/g) || []);
      if (rhsNames.includes(parsed.lhs)) circularVars.push(parsed.lhs);
    });
    const label = circularVars.length ? circularVars.join(', ') : 'unknown variable(s)';
    throw new Error(`Circular combinational assignment: ${label} depends on itself. Remove the self-dependency.`);
  }
}

  const duplicateVars = new Set(
    Object.keys(assignedCounts)
      .filter(k => assignedCounts[k] > 1)
  );

  return {
    writes,
    duplicateVars
  };
}
function isRegisterVar(name) {
  return getRegisteredVarNames().has(name);
}
// Intercept non-numeric keys in integer-only var inputs
function handleVarValKey(event, id, inputEl) {
  const el = inputEl || (id ? document.getElementById(id) : null);
  const allowed = ['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Enter','Home','End'];
  if (allowed.includes(event.key)) return;
  if (simDisplayBase === 'hex') {
    if (/^[0-9a-fA-FxX]$/.test(event.key)) return;
    event.preventDefault(); return;
  }
  if (simDisplayBase === 'bin') {
    if (/^[01bB]$/.test(event.key)) return;
    event.preventDefault(); return;
  }
  if (event.key === '-' && el && el.selectionStart === 0 && !el.value.includes('-')) return;
  if (!/^\d$/.test(event.key)) event.preventDefault();
}

// Update only the display values in the vars panel without re-rendering (preserves focus)
function updateVarDisplayValues() {
  document.querySelectorAll('.var-val[data-varkey]').forEach(el => {
    const k = el.dataset.varkey;
    if (k in simVars) {
      const bw = varBits[k] ?? varBitDefault;
      el.textContent = formatInBase(simVars[k], getVarBase(k), bw);
    }
  });
}

function revalidateAllBlocks() {
  liveCircularIds = new Set();
  liveCodeErrorIds = new Set();
  blocks.forEach(b => {
    if (!['state', 'output', 'decision'].includes(b.type)) return;
    const result = b.type === 'decision'
      ? validateDecisionCode(b.code)
      : validateAssignmentCode(b.code, b.type);
    if (!result.valid) liveCodeErrorIds.add(b.id);
    if (result.errors.some(e => e.includes('Circular'))) liveCircularIds.add(b.id);
  });
}

function toggleForcedRegister(key, checked) {
  if (checked) {
    forcedRegisters.add(key);
    if (!(key in regInitValues)) {
      regInitValues[key] = key in simVars ? simVars[key]
        : (key in combDefaults ? combDefaults[key] : 0);
    }
  } else {
    forcedRegisters.delete(key);
  }
  revalidateAllBlocks(); traceAsmBlock(); evalCombinationalPath(); render(); refreshPanels();
  updateCodeValidationDisplay();
}

function toggleRegisterConditional(key, checked) {
  if (!checked) return;
  forcedRegisters.delete(key);
  if (!(key in combDefaults)) {
    combDefaults[key] = key in simVars ? simVars[key]
      : (key in regInitValues ? regInitValues[key] : 0);
  }
  revalidateAllBlocks(); traceAsmBlock(); evalCombinationalPath(); render(); refreshPanels();
  updateCodeValidationDisplay();
}

function setRegInitValue(key, rawVal, inputEl) {
  if (!rawVal || rawVal === '-') return;
  const val = parseInBase(rawVal, getVarBase(key), varBits[key] ?? varBitDefault);
  if (val === null) return;
  regInitValues[key] = val;
  prevSimVars = {};
  lastWrittenVars = new Set();
  // Don't change simVars live — only takes effect on Reset
}

function setVarBits(key, rawVal) {
  const n = parseInt(rawVal, 10);
  if (!isNaN(n)) varBits[key] = Math.min(64, Math.max(1, n));
  else delete varBits[key];
  checkBitRanges(); refreshPanels(); updateCodeValidationDisplay();
}

function setVarBitDefault(rawVal) {
  const n = parseInt(rawVal, 10);
  if (!isNaN(n)) varBitDefault = Math.min(64, Math.max(1, n));
}

function removeVar(k) {
  delete userVars[k];
  traceAsmBlock(); evalCombinationalPath(); render(); refreshPanels();
}
function addVar() {
  const n = document.getElementById('vn').value.trim();
  const vRaw = document.getElementById('vv').value;
  if (!n) return;
  const v = parseIntSafe(vRaw);
  userVars[n] = v !== null ? v : 0;
  simVars[n]  = userVars[n];
  traceAsmBlock(); evalCombinationalPath(); render(); refreshPanels();
}
function renderTablePanel() {
  const stateBlocks = blocks.filter(b=>b.type==='state');
  if (!stateBlocks.length) {
    document.getElementById('panelContent').innerHTML='<div style="font-size:18px;color:var(--text3);padding:20px 0;text-align:center">No state blocks yet</div>';
    return;
  }
  const rows = [];
  stateBlocks.forEach(state => {
    // Find the first outgoing connection from this state
    const outConns = connections.filter(c=>c.from===state.id);
    if (!outConns.length) {
      rows.push({ state:state.name, condition:'—', output:'—', nextState:'—', isActive: activeBlock===state.id });
      return;
    }
    // Walk the ASM block combinatorially to find all paths
    const paths = [];
    function walkPath(curId, pathConns, depth) {
      if (depth > 20) return;
      const cur = blocks.find(b=>b.id===curId);
      if (!cur) return;
      if (cur.type==='state' && curId !== state.id) {
        paths.push({ conditions: pathConns.filter(c=>c.label).map(c=>c.label), outputs: [], nextState: cur.name });
        return;
      }
      const outs = connections.filter(c=>c.from===curId);
      if (!outs.length) {
        paths.push({ conditions: pathConns.filter(c=>c.label).map(c=>c.label), outputs: [], nextState:'(end)' });
        return;
      }
      if (cur.type==='decision') {
        outs.forEach(c => walkPath(c.to, [...pathConns,c], depth+1));
      } else {
        walkPath(outs[0].to, [...pathConns, outs[0]], depth+1);
      }
    }
    walkPath(state.id, [], 0);

    if (!paths.length) {
      rows.push({ state:state.name, condition:'—', output:'—', nextState:'—', isActive: activeBlock===state.id });
    } else {
      paths.forEach((p,i) => {
        rows.push({
          state: i===0 ? state.name : '',
          condition: p.conditions.join(' & ') || '—',
          nextState: p.nextState,
          isActive: activeBlock===state.id
        });
      });
    }
  });

  document.getElementById('panelContent').innerHTML=`
    <div class="editor-label" style="margin-bottom:8px">ASM Transition Table</div>
    <div style="overflow-x:auto">
    <table class="asm-table">
      <thead><tr>
        <th>State</th><th>Condition</th><th>Next State</th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`<tr class="${r.isActive&&r.state?'tbl-active':''}">
          <td style="color:${r.state?'#4f9eff':'var(--text3)'};font-weight:${r.state?'600':'400'}">${h(r.state)}</td>
          <td>${h(r.condition)}</td>
          <td style="color:var(--green)">${h(r.nextState)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
  `;
}

function ceilPow2(n) {
  if (n <= 1) return 1;
  return Math.pow(2, Math.ceil(Math.log2(n)));
}

// Wrap complex true-branch condition expressions in parens for display.
// Simple identifiers and already-parenthesised complements are left as-is.
function displayCondExpr(expr) {
  if (/^\([\s\S]*\)'$/.test(expr)) return expr;         // already (...)′
  if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(expr)) return expr; // simple name
  return `(${expr})`;
}

// Strip (expr)' wrapper to recover the base condition expression.
function baseCondExpr(expr) {
  const m = expr.match(/^\(([\s\S]*)\)'$/);
  return m ? m[1] : expr;
}

// Convert internal condition notation to plain English for display.
// (expr)' → NOT(expr), plain expr → as-is.
function condExprToText(expr) {
  const m = expr.match(/^\(([\s\S]*)\)'$/);
  return m ? `NOT(${m[1]})` : expr;
}

// Walk all combinational paths from a state box outward until the next state box.
// Returns [{conds:[{expr,label}], assigns:[{lhs,rhs}], nextStateName, nextStateId}]
function walkStatePathsForSynth(stateId) {
  const paths = [];
  function walk(curId, condStack, assignStack, depth) {
    if (depth > 50) return;
    const cur = blocks.find(b => b.id === curId); if (!cur) return;
    const outConns = connections.filter(c => c.from === curId);
    if (!outConns.length) {
      paths.push({ conds: condStack, assigns: assignStack, nextStateName: '(end)', nextStateId: null });
      return;
    }
    if (cur.type === 'decision') {
      outConns.forEach(conn => {
        let expr = cur.code.trim();
        if (conn.label === 'false') expr = `(${expr})'`;
        const nc = [...condStack, { expr, label: conn.label }];
        const next = blocks.find(b => b.id === conn.to); if (!next) return;
        if (next.type === 'state')
          paths.push({ conds: nc, assigns: assignStack, nextStateName: next.name, nextStateId: next.id });
        else walk(conn.to, nc, assignStack, depth + 1);
      });
    } else if (cur.type === 'output') {
      const na = [...assignStack];
      splitCodeStatements(cur.code, { blockType: 'output' }).forEach(stmt => {
        const p = parseAssignmentStatement(stmt); if (p) na.push({ lhs: p.lhs, rhs: p.rhs });
      });
      const conn = outConns[0]; if (!conn) return;
      const next = blocks.find(b => b.id === conn.to); if (!next) return;
      if (next.type === 'state')
        paths.push({ conds: condStack, assigns: na, nextStateName: next.name, nextStateId: next.id });
      else walk(conn.to, condStack, na, depth + 1);
    } else {
      const conn = outConns[0]; if (!conn) return;
      const next = blocks.find(b => b.id === conn.to); if (!next) return;
      if (next.type === 'state')
        paths.push({ conds: condStack, assigns: assignStack, nextStateName: next.name, nextStateId: next.id });
      else walk(conn.to, condStack, assignStack, depth + 1);
    }
  }
  walk(stateId, [], [], 0);
  return paths;
}

// Returns { registers, ctrlRows, allConditions, stateEncoding, stateBits, combSummary } or null.
function buildSynthesisData() {
  const stateBlocks = blocks.filter(b => b.type === 'state');
  if (!stateBlocks.length) return null;

  const registeredNames = getRegisteredVarNames();

  // State encoding: binary index per state block (in diagram order)
  const numStates = stateBlocks.length;
  const stateBits = numStates <= 1 ? 1 : Math.ceil(Math.log2(numStates));
  const stateEncoding = {};
  stateBlocks.forEach((sb, i) => {
    stateEncoding[sb.id] = { name: sb.name, index: i, binary: i.toString(2).padStart(stateBits, '0') };
  });

  // Collect unique RHS expressions per register
  const regRhsMap = {};
  registeredNames.forEach(v => { regRhsMap[v] = []; });

  // Combinational variable tracking
  const allAsmAssigned = new Set();
  blocks.forEach(b => extractAssignedNames(b.code, { blockType: b.type }).forEach(n => allAsmAssigned.add(n)));
  const combVarNames = [...allAsmAssigned].filter(v => !registeredNames.has(v));
  const combMap = {}; // varName -> [{stateName, rawConds, rhs}]
  combVarNames.forEach(v => { combMap[v] = []; });

  // Build raw rows: one per state × path
  const rawRows = [];

  stateBlocks.forEach(stateB => {
    const stateAssigns = {};
    splitCodeStatements(stateB.code, { blockType: 'state' }).forEach(stmt => {
      const p = parseAssignmentStatement(stmt); if (!p) return;
      if (registeredNames.has(p.lhs)) {
        stateAssigns[p.lhs] = p.rhs;
        if (!regRhsMap[p.lhs].includes(p.rhs)) regRhsMap[p.lhs].push(p.rhs);
      }
    });

    walkStatePathsForSynth(stateB.id).forEach(path => {
      const rowAssigns = { ...stateAssigns };
      path.assigns.forEach(a => {
        if (registeredNames.has(a.lhs)) {
          rowAssigns[a.lhs] = a.rhs;
          if (!regRhsMap[a.lhs].includes(a.rhs)) regRhsMap[a.lhs].push(a.rhs);
        }
        if (combMap[a.lhs] !== undefined)
          combMap[a.lhs].push({ stateName: stateB.name, rawConds: path.conds, rhs: a.rhs });
      });
      rawRows.push({
        stateId: stateB.id, stateName: stateB.name,
        rawConds: path.conds,
        nextStateName: path.nextStateName, nextStateId: path.nextStateId,
        assigns: rowAssigns,
        unconnected: path.nextStateId === null
      });
    });
  });

  // Build registers with pow-2 mux sizes
  const registers = [];
  registeredNames.forEach(v => {
    // Only include hold if at least one path leaves this register unassigned
    const needsHold = rawRows.some(row => row.assigns[v] === undefined);
    const inputs = [];
    if (needsHold) inputs.push({ idx: 0, expr: v, label: 'hold' });
    regRhsMap[v].forEach(rhs => inputs.push({ idx: inputs.length, expr: rhs, label: rhs }));
    const muxActual   = inputs.length || 1;
    const muxSizePow2 = ceilPow2(muxActual);
    const selBits     = Math.max(1, Math.log2(muxSizePow2));
    registers.push({ name: v, inputs, muxActual, muxSizePow2, selBits });
  });

  // Collect all unique base condition expressions across all rows
  const allConditions = [];
  rawRows.forEach(row => {
    row.rawConds.forEach(c => {
      const base = baseCondExpr(c.expr);
      if (!allConditions.includes(base)) allConditions.push(base);
    });
  });

  // Build control rows with sel signals and condValues
  const ctrlRows = rawRows.map(row => {
    const sels = {};
    registers.forEach(reg => {
      const rhs = row.assigns[reg.name];
      const found = rhs !== undefined ? reg.inputs.findIndex(inp => inp.expr === rhs) : -1;
      sels[reg.name] = found >= 0 ? found : 0;
    });
    const condValues = {};
    allConditions.forEach(expr => { condValues[expr] = 'X'; });
    row.rawConds.forEach(c => { condValues[baseCondExpr(c.expr)] = c.label === 'true' ? '1' : '0'; });
    return { ...row, sels, condValues };
  });

  // Combinational summary
  const combSummary = combVarNames
    .filter(v => combMap[v].length > 0)
    .map(v => ({ name: v, def: v in combDefaults ? combDefaults[v] : 0, entries: combMap[v] }));

  return { registers, ctrlRows, allConditions, stateEncoding, stateBits, combSummary };
}

function checkBitRanges() {
  bitRangeVarNames.clear();
  const registeredNames = getRegisteredVarNames();
  const check = (v, val) => {
    if (typeof val !== 'number' || !Number.isInteger(val)) return;
    const bits = varBits[v] ?? varBitDefault;
    const half = Math.pow(2, bits - 1);
    if (val < -half || val > half - 1) bitRangeVarNames.add(v);
  };
  registeredNames.forEach(v => { if (v in simVars) check(v, simVars[v]); });
  Object.keys(userVars).forEach(v => check(v, userVars[v]));
}

function toggleSynthPanel() {
  synthPanelOpen = !synthPanelOpen;
  const panel    = document.getElementById('synthPanel');
  const resizer  = document.getElementById('synthResizer');

  panel.style.display   = synthPanelOpen ? 'flex'  : 'none';

// ── DPATH pane ──────────────────────────────────────────
function renderDatapathPanel() {
  const pc = document.getElementById('synthDpath');
  if (!pc) return;
  if (!blocks.filter(b => b.type === 'state').length) {
    pc.innerHTML = '<div style="font-size:16px;color:var(--text3);padding:16px 0;text-align:center">No state blocks yet</div>';
    return;
  }
  const data = buildSynthesisData();
  if (!data) { pc.innerHTML = '<div style="font-size:16px;color:var(--text3);padding:16px 0;text-align:center">Nothing to synthesize</div>'; return; }
  const { registers, combSummary } = data;
  let html = '';

  // Section 1: Register table
  html += `<div class="editor-label" style="margin-bottom:6px">Registers</div>`;
  if (!registers.length) {
    html += `<div style="font-size:16px;color:var(--text3);margin-bottom:14px">No registered variables found.</div>`;
  } else {
    const maxInputs = Math.max(...registers.map(r => r.inputs.length));
    html += `<div style="overflow-x:auto;margin-bottom:4px"><table class="asm-table"><thead><tr><th>Register</th>`;
    for (let i = 0; i < maxInputs; i++)
      html += `<th style="color:var(--purple)">Mux[${i}]</th>`;
    html += `<th>Mux size</th></tr></thead><tbody>`;
    registers.forEach(reg => {
      html += `<tr><td style="color:var(--accent);font-weight:600">${h(reg.name)}</td>`;
      for (let i = 0; i < maxInputs; i++) {
        const inp = reg.inputs[i];
        if (inp) {
          const label = inp.label === 'hold' ? `${inp.expr} (hold)` : inp.expr;
          html += `<td style="color:var(--green)">${h(label)}</td>`;
        } else {
          html += `<td style="color:var(--text3)">—</td>`;
        }
      }
      html += `<td style="color:var(--amber);font-weight:600">${reg.muxSizePow2}-to-1</td></tr>`;
    });
    html += `</tbody></table></div>`;
    html += `<div style="font-size:13px;color:var(--text3);margin-bottom:14px">Mux size rounded to next power of 2.</div>`;
  }

  // Section 2: Required operations
  const allOps = new Set();
  registers.forEach(reg => reg.inputs.filter(i => i.label !== 'hold').forEach(inp => allOps.add(inp.expr)));
  if (allOps.size) {
    html += `<div class="editor-label" style="margin-bottom:6px">Other Required Datapath Blocks</div>`;
    html += `<div style="font-size:14px;color:var(--red);margin-bottom:8px">These expressions must be implemented as combinational circuits feeding the register muxes:</div>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">`;
    allOps.forEach(op => {
      html += `<span style="font-family:var(--mono);background:var(--bg2);color:var(--green);padding:5px 12px;border-radius:4px;font-size:14px;border:1px solid var(--border2);display:inline-block">${h(op)}</span>`;
    });
    html += `</div>`;
  }

  // Section 3: Combinational outputs (condition → value, else → default)
  if (combSummary.length) {
    html += `<div class="editor-label" style="margin-bottom:6px">Combinational Outputs</div>`;
    html += `<div style="overflow-x:auto;margin-bottom:8px"><table class="asm-table"><thead><tr><th>Variable</th><th>Expression</th><th>Value</th></tr></thead><tbody>`;
    combSummary.forEach(cv => {
      cv.entries.forEach((e, i) => {
        const condParts = e.rawConds.map(c => h(displayCondExpr(c.expr))).join(' • ');
        const whenStr = condParts ? `${h(e.stateName)} • ${condParts}` : h(e.stateName);
        html += `<tr>
          ${i===0 ? `<td style="color:var(--purple);font-weight:600" rowspan="${cv.entries.length+1}">${h(cv.name)}</td>` : ''}
          <td style="color:#4f9eff">${whenStr}</td>
          <td style="color:var(--green);font-family:var(--mono)">${h(e.rhs)}</td>
        </tr>`;
      });
      // else row
      html += `<tr>
        <td style="color:var(--text3);font-style:italic">else</td>
        <td style="color:var(--text3);font-style:italic;font-family:var(--mono)">${h(String(cv.def))}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  pc.innerHTML = html;
}

// ── CTRL pane ───────────────────────────────────────────
function renderCtrlPanel() {
  const pc = document.getElementById('synthCtrl');
  if (!pc) return;
  const stateBlocks = blocks.filter(b => b.type === 'state');
  if (!stateBlocks.length) {
    pc.innerHTML = '<div style="font-size:16px;color:var(--text3);padding:16px 0;text-align:center">No state blocks yet</div>';
    return;
  }
  const data = buildSynthesisData();
  if (!data) { pc.innerHTML = '<div style="font-size:16px;color:var(--text3);padding:16px 0;text-align:center">Nothing to synthesize</div>'; return; }
  const { registers, ctrlRows, allConditions, stateEncoding, stateBits } = data;
  let html = '';

  // State encoding table
  html += `<div class="editor-label" style="margin-bottom:6px">State Encoding (${stateBits}-bit)</div>`;
  html += `<div style="overflow-x:auto;margin-bottom:16px"><table class="asm-table"><thead><tr><th>State</th><th>Binary</th></tr></thead><tbody>`;
  stateBlocks.forEach(sb => {
    const enc = stateEncoding[sb.id];
    const isActive = sb.id === activeBlock;
    html += `<tr class="${isActive?'tbl-active':''}"><td style="color:#4f9eff">${h(sb.name)}</td><td style="font-family:var(--mono);color:var(--amber)">${enc.binary}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  // Controller truth table
  html += `<div class="editor-label" style="margin-bottom:6px">Controller</div>`;
  if (!ctrlRows.length) {
    html += `<div style="font-size:16px;color:var(--text3)">No paths found.</div>`;
  } else {
    html += `<div style="overflow-x:auto;margin-bottom:16px"><table class="asm-table"><thead><tr>`;
    html += `<th style="text-align:center">State</th>`;
    allConditions.forEach(cond => html += `<th style="text-align:center;color:var(--amber)">${h(displayCondExpr(cond))}</th>`);
    html += `<th style="text-align:center">Next State</th>`;
    registers.forEach(reg => html += `<th style="text-align:center;color:var(--purple)">${h(reg.name)}_ctrl</th>`);
    html += `</tr></thead><tbody>`;

    let prevStateId = null;
    ctrlRows.forEach(row => {
      const isActive = row.stateId === activeBlock;
      const isFirst  = row.stateId !== prevStateId;
      prevStateId = row.stateId;
      const enc     = stateEncoding[row.stateId];
      const nextEnc = row.nextStateId ? stateEncoding[row.nextStateId] : null;

      html += `<tr class="${isActive?'tbl-active':''}">`;

      // State column
      html += `<td style="white-space:nowrap;text-align:center;color:${isFirst?'#4f9eff':'var(--text3)'};font-weight:${isFirst?600:400}">`;
      if (isFirst && enc) html += `${h(row.stateName)} <span style="font-family:var(--mono);font-size:13px;color:var(--amber)">(${enc.binary})</span>`;
      html += `</td>`;

      // Condition input columns
      allConditions.forEach(cond => {
        const val = row.condValues[cond];
        const style = val==='X' ? 'color:var(--text3)' : val==='1' ? 'color:var(--green);font-weight:600' : 'color:#f87171;font-weight:600';
        html += `<td style="font-family:var(--mono);text-align:center;${style}">${val}</td>`;
      });

      // Next state column (before ctrl signals)
      if (row.unconnected) {
        html += `<td style="text-align:center;color:#f87171;font-weight:600">UNCONNECTED</td>`;
      } else if (nextEnc) {
        html += `<td style="white-space:nowrap;text-align:center;color:var(--green)">${h(row.nextStateName)} <span style="font-family:var(--mono);font-size:13px;color:var(--amber)">(${nextEnc.binary})</span></td>`;
      } else {
        html += `<td style="text-align:center;color:var(--text3)">X</td>`;
      }

      // Mux control signal columns
      registers.forEach(reg => {
        const selIdx   = row.sels[reg.name] ?? 0;
        const inp      = reg.inputs[selIdx];
        const selBin   = selIdx.toString(2).padStart(reg.selBits, '0');
        html += `<td style="white-space:nowrap;text-align:center;color:var(--text)">`;
        html += `<span style="font-family:var(--mono);font-weight:600">${selBin}</span>`;
        const inpLabel = inp ? (inp.label === 'hold' ? `${inp.expr} (hold)` : inp.expr) : '?';
        html += ` <span style="font-size:13px;color:var(--green)">(${h(inpLabel)})</span></td>`;
      });

      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  }

  pc.innerHTML = html;
}

// ════════════════════════════════════════════════════════
//  SIMULATION
// ════════════════════════════════════════════════════════
function getRunInterval() {
  const v = +document.getElementById('speedSlider').value;
  return Math.round(1200 / v);
}

// Shared init: set up simVars, point activeBlock at start state,
// highlight it at CLK 0 — no execution yet.
function beginSim() {
  simVars = { ...userVars };
  lastCycleFingerprint = null; loopRepeatCount = 0; simFinished = false;
  stepHistory = []; prevSimVars = {}; lastWrittenVars = new Set();

  // Pre-initialize every variable that appears as an LHS assignment in any
  // ASM box, so workVars inside advanceClockCycle is always complete and
  // applyCode can capture new variable writes from the very first cycle.
  const registeredNames = getRegisteredVarNames();
  blocks.forEach(b => {
    extractAssignedNames(b.code, { blockType: b.type }).forEach(varName => {
      if (!(varName in simVars)) {
        const initVal = (varName in regInitValues) ? regInitValues[varName]
          : registeredNames.has(varName) ? 0
          : (varName in combDefaults ? combDefaults[varName] : 0);
        simVars[varName] = initVal;
      }
    });
  });
  // Apply regInitValues for registered vars (overrides userVars copy)
  registeredNames.forEach(varName => {
    if (varName in regInitValues) simVars[varName] = regInitValues[varName];
  });

  const startB = blocks.find(b => b.id === startBlockId && b.type === 'state')
              || blocks.find(b => b.type === 'state');
  if (!startB) return;
  activeBlock = startB.id;
  simStep = 0;
  traceAsmBlock();
  evalCombinationalPath();
  document.getElementById('stepCounter').textContent = 'CLK 0';
}

function resetSim() {
  clearInterval(runInterval); isRunning = false;
  document.getElementById('btnRun').textContent = '▶ Run';
  document.getElementById('btnRun').className = 'btn success';
  simLog = [];
  activeTrail = new Set(); activeConnTrail = new Set();
  bitRangeVarNames.clear();
  beginSim();
  checkBitRanges();
  render(); refreshPanels();
}

function stepSim() {
  if (!blocks.length) return;
  if (simFinished) return;
  if (activeBlock === null) { beginSim(); render(); return; }
  // Block stepping when any block has invalid code
  if (liveCodeErrorIds.size > 0 || liveCircularIds.size > 0) {
    alert('Cannot simulate: one or more blocks have invalid code (shown in red). Fix all errors before running.');
    return;
  }
  // Block stepping when there is a double-driver conflict
  if (liveDoubleDriverIds.size > 0) {
    alert('Cannot simulate: double driver conflict (⚡) — the same variable is assigned in multiple places on the active path. Fix conflicting assignments first.');
    return;
  }
  // Block stepping when a register value is out of its bit-width range
  if (bitRangeVarNames.size > 0) {
    alert(`Cannot simulate: ${[...bitRangeVarNames].join(', ')} ${bitRangeVarNames.size > 1 ? 'are' : 'is'} out of 2's-complement range for the declared bit width. Fix the bit width or the value.`);
    return;
  }
  prevSimVars = { ...simVars };
  advanceClockCycle();
  checkBitRanges();
  document.getElementById('stepCounter').textContent = simFinished ? 'DONE' : `CLK ${simStep}`;
  render(); refreshPanels();
}

// ── Variable classification ───────────────────────────
// Scan the entire design and return the set of variable names
// that are assigned inside ANY state box. These are "registered"
// variables — they update on the next positive clock edge.
// Variables assigned ONLY in conditional-output boxes (never in
// a state box) are purely combinational.
function getRegisteredVarNames() {
  const registered = new Set();
  blocks.filter(b => b.type === 'state').forEach(b => {
    extractAssignedNames(b.code, { blockType: b.type }).forEach(n => registered.add(n));
  });
  // Also include any comb vars the user has promoted to register
  forcedRegisters.forEach(n => registered.add(n));
  return registered;
}

// Normalize <- and (legacy) <= assignment syntax to = so JS can run it.
function normalizeCode(code, options = {}) {
  let out = code.replace(/\b([A-Za-z_$][A-Za-z0-9_$]*)\s*(?:<-|←)\s*/g, '$1 = ');
  // Keep <= as assignment alias in state/output boxes for backwards compatibility
  // (new code should use = directly; the editor no longer auto-converts <=)
  if (options.blockType && options.blockType !== 'decision') {
    out = out.replace(/\b([A-Za-z_$][A-Za-z0-9_$]*)\s*<=\s*(?=[A-Za-z0-9_$\-\+(])/g, '$1 = ');
  }
  return out;
}

// Extract all variable names that appear on the LEFT side of
// assignments in a block of JS-like code.
function extractAssignedNames(code, options = {}) {
  const names = new Set();
  splitCodeStatements(code, options).forEach(stmt => {
    const parsed = parseAssignmentStatement(stmt);
    if (parsed) names.add(parsed.lhs);
  });
  return names;
}

// Run code against a given variable scope and return only the
// variables that were actually changed (the delta).
function runCodeGetDelta(code, scope) {
  if (!code.trim()) return {};
  const delta = {};
  const { writes } = evaluateAssignmentBlock(code, scope);
  writes.forEach(({ varName, value }) => {
    if (!(varName in scope) || scope[varName] !== value) {
      delta[varName] = value;
    }
  });
  return delta;
}

// Structural double-driver scan used when no simulation is running.
// Flags any state box + output box on any path that both assign the same var.
function scanDesignTimeDoubleDrivers() {
  liveDoubleDriverIds = new Set();
  liveDoubleDriverVarNames = new Set();
  blocks.filter(b => b.type === 'state').forEach(stateB => {
    const stateAssigned = new Set(extractAssignedNames(stateB.code, { blockType: 'state' }));
    function walk(curId, depth) {
      if (depth > 50) return;
      connections.filter(c => c.from === curId).forEach(conn => {
        const next = blocks.find(b => b.id === conn.to);
        if (!next || next.type === 'state') return;
        if (next.type === 'output') {
          extractAssignedNames(next.code, { blockType: 'output' }).forEach(varName => {
            if (stateAssigned.has(varName)) {
              liveDoubleDriverIds.add(stateB.id);
              liveDoubleDriverIds.add(next.id);
              liveDoubleDriverVarNames.add(varName);
            }
          });
        }
        walk(conn.to, depth + 1);
      });
    }
    walk(stateB.id, 0);
  });
}

// ── Evaluate combinational outputs along current active path ──
// 1. Resets all purely-combinational vars to their combDefaults
// 2. Walks the active path, applies comb-only assignments instantly
// 3. Detects double-drivers (same var assigned in state box AND output box)
// 4. Populates liveDoubleDriverIds for red rendering
function evalCombinationalPath() {
  liveDoubleDriverIds = new Set();
  liveDoubleDriverVarNames = new Set();
  if (!activeBlock) {
    scanDesignTimeDoubleDrivers();
    return;
  }

  const registeredNames  = getRegisteredVarNames();

  // Find all vars assigned anywhere in ASM boxes (registered or comb)
  const allAsmAssigned = new Set();
  blocks.forEach(b => extractAssignedNames(b.code, { blockType: b.type }).forEach(n => allAsmAssigned.add(n)));

  // Step 1: Reset purely-combinational vars to their defaults
  allAsmAssigned.forEach(varName => {
    if (!registeredNames.has(varName)) {
      simVars[varName] = (varName in combDefaults) ? combDefaults[varName] : 0;
    }
  });

  const stateB = blocks.find(b => b.id === activeBlock);
  if (!stateB) return;

  let stateEval;
  try {
    stateEval = evaluateAssignmentBlock(stateB.code, { ...simVars }, { blockType:'state' });
  } catch (e) {
    return;
  }

  const stateAssigned = new Set(stateEval.writes.map(w => w.varName));
  stateEval.duplicateVars.forEach(varName => {
    liveDoubleDriverIds.add(activeBlock);
    liveDoubleDriverVarNames.add(varName);
  });

  const activeOutputWrites = new Map();

  // Step 2: Walk path
  let cur = stateB.id, safety = 0;
  while (true) {
    if (++safety > 50) break;
    const curBlock = blocks.find(b => b.id === cur); if (!curBlock) break;
    let conn;
    if (curBlock.type === 'decision') {
      let res = false;
      try {
        const scope = { ...simVars };
        extractAssignedNames(curBlock.code, { blockType: curBlock.type }).forEach(n => { if (!(n in scope)) scope[n] = 0; });
        const kn = Object.keys(scope), kv = Object.values(scope);
        res = !!(new Function(...kn, 'return (' + preprocessBitExpr(curBlock.code) + ');'))(...kv);
      } catch(e) {}
      const br = res ? 'true' : 'false';
      conn = connections.find(c => c.from===cur && (c.label===br || c.label===String(res)))
          || connections.find(c => c.from===cur);
    } else {
      conn = connections.find(c => c.from === cur);
    }
    if (!conn) break;
    const nextBlock = blocks.find(b => b.id === conn.to); if (!nextBlock) break;
    if (nextBlock.type === 'state') break;
    cur = conn.to;

    if (nextBlock.type === 'output') {
      let outEval;
      try {
        const scope = { ...simVars };
        outEval = evaluateAssignmentBlock(nextBlock.code, scope, { blockType:'output' });
      } catch (e) {
        break;
      }

      const outAssigned = new Set(outEval.writes.map(w => w.varName));

      // Double-driver check
      outAssigned.forEach(varName => {
        if (stateAssigned.has(varName)) {
          liveDoubleDriverIds.add(activeBlock);
          liveDoubleDriverIds.add(nextBlock.id);
          liveDoubleDriverVarNames.add(varName);  // only the specific var
        }
      });

      outEval.duplicateVars.forEach(varName => {
        liveDoubleDriverIds.add(nextBlock.id);
        liveDoubleDriverVarNames.add(varName);
      });

      outEval.writes.forEach(({ varName, value }) => {
        if (activeOutputWrites.has(varName)) {
          const prev = activeOutputWrites.get(varName);
          liveDoubleDriverIds.add(prev.blockId);
          liveDoubleDriverIds.add(nextBlock.id);
          liveDoubleDriverVarNames.add(varName);
        } else {
          activeOutputWrites.set(varName, { value, blockId: nextBlock.id });
        }
      });

      // Apply only purely-combinational vars immediately
      outEval.writes.forEach(({ varName, value }) => {
        if (!registeredNames.has(varName)) {
          simVars[varName] = value;
        }
      });
    }
  }
}

// ── Step back ─────────────────────────────────────────
function stepBack() {
  if (!stepHistory.length) return;
  const snap = stepHistory.pop();
  simVars              = { ...snap.simVars };
  activeBlock          = snap.activeBlock;
  simStep              = snap.simStep;
  simLog               = snap.simLog.map(e => ({ ...e }));
  simFinished          = snap.simFinished;
  activeTrail          = new Set(snap.activeTrail);
  activeConnTrail      = new Set(snap.activeConnTrail);
  lastCycleFingerprint = snap.lastCycleFingerprint;
  loopRepeatCount      = snap.loopRepeatCount;
  prevSimVars          = {};  // no flash on step-back
  lastWrittenVars      = new Set();
  traceAsmBlock(); evalCombinationalPath();
  document.getElementById('stepCounter').textContent = `CLK ${simStep}`;
  render();
  if (activeTab === 'log')   renderLogPanel();
  if (activeTab === 'vars')  renderVarsPanel();
  if (activeTab === 'table') renderTablePanel();
  if (synthPanelOpen) { renderDatapathPanel(); renderCtrlPanel(); }
}

// ── Two-pass clock cycle ──────────────────────────────
// Pass 1 (combinational walk):
//   • State box:  collect assignments → nextStateBuffer (all registered)
//   • Decision:   evaluate expression using current simVars + any
//                 combinational updates already applied this cycle
//   • Cond. output: for each assigned var —
//       if registered → nextStateBuffer
//       if combinational → apply immediately to simVars so downstream
//                          decisions see the updated value
// Pass 2 (clock edge / commit):
//   • Flush nextStateBuffer into simVars
function advanceClockCycle() {
  if (!activeBlock || simFinished) return;
  const stateB = blocks.find(b => b.id === activeBlock);
  if (!stateB || stateB.type !== 'state') { addLog('error', 'Expected a state block'); return; }

  // Push snapshot for step-back
  stepHistory.push({
    simVars:              { ...simVars },
    activeBlock,
    simStep,
    simLog:               simLog.map(e => ({ ...e })),
    simFinished,
    activeTrail:          [...activeTrail],
    activeConnTrail:      [...activeConnTrail],
    lastCycleFingerprint,
    loopRepeatCount
  });
  if (stepHistory.length > 100) stepHistory.shift();

  activeTrail     = new Set();
  activeConnTrail = new Set();
  lastWrittenVars = new Set();   // reset for this cycle
  const cycleLog  = [];

  // Classify variables at design-time (every cycle, cheap enough)
  const registeredNames = getRegisteredVarNames();

  // nextStateBuffer holds registered writes — committed at clock edge
  const nextStateBuffer = {};

  // Working copy of simVars; combinational writes go here immediately
  // so that downstream decisions within the same cycle see them.
  // Registered writes go into nextStateBuffer instead.
  const workVars = { ...simVars };

  // Helper: evaluate a (possibly bit-slice/concat) expression against workVars
  function evalInCycle(expr) {
    if (!expr.trim()) return false;
    const ns = Object.keys(workVars), vs = Object.values(workVars);
    return !!(new Function(...ns, 'return (' + preprocessBitExpr(expr) + ');'))(...vs);
  }

  // Helper: run code, split results into registered / combinational
  function applyCode(code, blockType, blockName) {
    if (!code.trim()) return;
    const baseScope = { ...workVars };
    const { writes, duplicateVars } = evaluateAssignmentBlock(code, baseScope, { blockType });

    duplicateVars.forEach(varName => {
      const where = `[${blockName || stateB.name}]`;
      cycleLog.push({ type:'error', msg:`  ⚡ DOUBLE DRIVER: '${varName}' assigned more than once in ${where}` });
    });

    writes.forEach(({ varName, value }) => {
      if (!(varName in workVars)) workVars[varName] = 0;
      lastWrittenVars.add(varName);
      if (registeredNames.has(varName)) {
        nextStateBuffer[varName] = value;
      } else {
        workVars[varName] = value;
      }
    });
  }

  try {
    // ── Execute state box ──────────────────────────────
    applyCode(stateB.code, 'state', stateB.name);
    cycleLog.push({ type:'active', msg:`CLK ${simStep + 1} ▶ [${stateB.name}]` });
    stateB.code.split('\n').filter(l => l.trim()).forEach(l => {
      const varName = [...extractAssignedNames(l, { blockType: 'state' })][0];
      const tag = varName && registeredNames.has(varName) ? ' [reg]' : '';
      cycleLog.push({ type:'active', msg:`  ${l.trim()}${tag}` });
    });
    activeTrail.add(stateB.id);

    // ── Walk combinational path ────────────────────────
    let cur = stateB.id, safety = 0;
    while (true) {
      if (++safety > 50) { cycleLog.push({ type:'error', msg:'  Too many hops in ASM block' }); break; }

      // Find next connection from current block
      // For decision blocks use true/false label matching;
      // for everything else just take the first outgoing wire.
      let conn;
      const curBlock = blocks.find(b => b.id === cur);
      if (!curBlock) { cycleLog.push({ type:'error', msg:'  Missing block' }); simFinished=true; break; }

      if (curBlock.type === 'decision') {
        const res = evalInCycle(curBlock.code);
        cycleLog.push({ type:'decision', msg:`  ◆ [${curBlock.name}] ${curBlock.code} → ${res}` });
        const br = res ? 'true' : 'false';
        conn = connections.find(c => c.from === cur && (c.label === br || c.label === String(res)))
            || connections.find(c => c.from === cur);
        if (!conn) { cycleLog.push({ type:'error', msg:'  No connection for: '+br }); simFinished=true; break; }
      } else {
        conn = connections.find(c => c.from === cur);
        if (!conn) { cycleLog.push({ type:'active', msg:`  ▣ [${curBlock.name}] end of flow` }); simFinished=true; break; }
      }

      activeConnTrail.add(conn.id);

      // Where does this wire lead?
      const nextId = conn.to;

      // If it leads to a state block → end of this ASM block
      const nextBlock = blocks.find(b => b.id === nextId);
      if (!nextBlock) { cycleLog.push({ type:'error', msg:'  Broken connection' }); simFinished=true; break; }

      if (nextBlock.type === 'state') {
        cycleLog.push({ type:'active', msg:`  → [${nextBlock.name}]` });
        activeBlock = nextId;
        break;
      }
      // Advance cur to next block
      cur = nextId;
      activeTrail.add(cur);

      // Execute conditional output box (decisions already handled above)
      if (nextBlock.type === 'output') {
        // Double-driver check: output assigns a var also assigned by state box
        const outEval = evaluateAssignmentBlock(nextBlock.code, { ...workVars }, { blockType:'output' });
        const stateEval = evaluateAssignmentBlock(stateB.code, { ...simVars }, { blockType:'state' });
        const outAssigned = new Set(outEval.writes.map(w => w.varName));
        const stateAssigned = new Set(stateEval.writes.map(w => w.varName));
        outAssigned.forEach(varName => {
          if (stateAssigned.has(varName)) {
            cycleLog.push({ type:'error',
              msg:`  ⚡ DOUBLE DRIVER: '${varName}' assigned in both [${stateB.name}] and [${nextBlock.name}]` });
          }
        });
        applyCode(nextBlock.code, 'output', nextBlock.name);
        nextBlock.code.split('\n').filter(l => l.trim()).forEach(l => {
          const varName = [...extractAssignedNames(l, { blockType: 'output' })][0];
          const isReg   = varName && registeredNames.has(varName);
          const tag     = isReg ? ' [reg]' : ' [comb]';
          cycleLog.push({ type:'output', msg:`  ⬭ [${nextBlock.name}] ${l.trim()}${tag}` });
        });
      }
      // Decision blocks: already logged above, just advance cur and loop
    }
  } catch(err) {
    cycleLog.push({ type:'error', msg:'Error: ' + err.message });
    simFinished = true;
  }

  // ── Clock edge: commit registered writes ───────────
  Object.assign(workVars, nextStateBuffer);
  simVars = workVars;

  if (Object.keys(nextStateBuffer).length) {
    const pairs = Object.entries(nextStateBuffer).map(([k,v]) => `${k}=${JSON.stringify(v)}`).join(', ');
    cycleLog.push({ type:'active', msg:`  ↑ CLK edge: ${pairs}` });
  }

  // ── Loop detection ──────────────────────────────────
  const fingerprint = activeBlock + '|' + JSON.stringify(simVars, Object.keys(simVars).sort());
  if (simFinished) {
    cycleLog.forEach(e => simLog.push({ step:simStep + 1, type:e.type, msg:e.msg }));
    if (simLog.length > 200) simLog.splice(0, simLog.length - 200);
  } else if (fingerprint === lastCycleFingerprint) {
    loopRepeatCount++;
    const last = simLog[simLog.length - 1];
    if (last && last._loopNotice) {
      last.msg = `  ↻ Repeating loop × ${loopRepeatCount + 1}  (state: ${stateB.name}, vars stable)`;
      last.step = simStep + 1;
    } else {
      simLog.push({ step:simStep + 1, type:'decision', _loopNotice:true,
        msg:`  ↻ Repeating loop × 2  (state: ${stateB.name}, vars stable)` });
    }
    if (simLog.length > 200) simLog.splice(0, simLog.length - 200);
  } else {
    loopRepeatCount = 0;
    lastCycleFingerprint = fingerprint;
    cycleLog.forEach(e => simLog.push({ step:simStep + 1, type:e.type, msg:e.msg }));
    if (simLog.length > 200) simLog.splice(0, simLog.length - 200);
  }

  simStep++;

  // Highlight new current state immediately
  if (!simFinished) {
    traceAsmBlock(); evalCombinationalPath();
  } else {
    // End of flow — unhighlight everything, nothing is active
    activeBlock     = null;
    activeTrail     = new Set();
    activeConnTrail = new Set();
  }
}

// traceAsmBlock: visual-only trace with current simVars (no execution)
function traceAsmBlock() {
  activeTrail = new Set(); activeConnTrail = new Set();
  if (!activeBlock) return;
  const stateB = blocks.find(b => b.id === activeBlock); if (!stateB) return;
  activeTrail.add(stateB.id);

  const registeredNames = getRegisteredVarNames();

  // Working scope so output-box comb assignments propagate to downstream decisions
  const workScope = { ...simVars };
  // Reset comb vars to defaults for a clean trace
  const allAsmAssigned = new Set();
  blocks.forEach(b => extractAssignedNames(b.code, { blockType: b.type }).forEach(n => allAsmAssigned.add(n)));
  allAsmAssigned.forEach(varName => {
    if (!registeredNames.has(varName)) {
      workScope[varName] = (varName in combDefaults) ? combDefaults[varName] : 0;
    }
  });

  let cur = stateB.id, safety = 0;
  while (true) {
    if (++safety > 50) break;
    const curBlock = blocks.find(b => b.id === cur); if (!curBlock) break;

    let conn;
    if (curBlock.type === 'decision') {
      let res = false;
      try {
        const ns = Object.keys(workScope), vs = Object.values(workScope);
        res = !!(new Function(...ns, 'return (' + preprocessBitExpr(curBlock.code) + ');'))(...vs);
      } catch(e) {}
      const br = res ? 'true' : 'false';
      conn = connections.find(c => c.from===cur && (c.label===br || c.label===String(res)))
          || connections.find(c => c.from===cur);
    } else {
      conn = connections.find(c => c.from === cur);
    }
    if (!conn) break;
    activeConnTrail.add(conn.id);

    const nextBlock = blocks.find(b => b.id === conn.to); if (!nextBlock) break;
    if (nextBlock.type === 'state') break; // wire lit, state NOT added to trail

    cur = conn.to;
    activeTrail.add(cur);

    // Apply comb output effects so subsequent decisions see updated values
    if (nextBlock.type === 'output') {
      try {
        const { writes } = evaluateAssignmentBlock(nextBlock.code, { ...workScope }, { blockType: 'output' });
        writes.forEach(({ varName, value }) => {
          if (!registeredNames.has(varName)) workScope[varName] = value;
        });
      } catch(e) {}
    }
  }
}

function addLog(type, msg) {
  simLog.push({ step:simStep, type, msg });
  if (simLog.length > 200) simLog.shift();
}

function runSim() {
  if (isRunning) {
    clearInterval(runInterval); isRunning = false;
    document.getElementById('btnRun').textContent = '▶ Run';
    document.getElementById('btnRun').className = 'btn success'; return;
  }
  if (!blocks.length) return;
  if (liveCodeErrorIds.size > 0 || liveCircularIds.size > 0) {
    alert('Cannot simulate: one or more blocks have invalid code (shown in red). Fix all errors before running.');
    return;
  }
  if (liveDoubleDriverIds.size > 0) {
    alert('Cannot simulate: double driver conflict (⚡) — fix conflicting assignments first.');
    return;
  }
  if (activeBlock === null) { beginSim(); render(); }
  isRunning = true;
  document.getElementById('btnRun').textContent = '■ Stop';
  document.getElementById('btnRun').className = 'btn danger';

  const tick = () => {
    if (!activeBlock || simFinished) {
      clearInterval(runInterval); isRunning = false;
      document.getElementById('btnRun').textContent = '▶ Run';
      document.getElementById('btnRun').className = 'btn success'; return;
    }
    if (liveDoubleDriverIds.size > 0 || bitRangeVarNames.size > 0) {
      addLog('error', liveDoubleDriverIds.size > 0 ? '⚡ Cannot run: double driver conflict.' : `⚠ Cannot run: ${[...bitRangeVarNames].join(', ')} out of range.`);
      clearInterval(runInterval); isRunning = false;
      document.getElementById('btnRun').textContent = '▶ Run';
      document.getElementById('btnRun').className = 'btn success';
      if (activeTab === 'log') renderLogPanel();
      return;
    }
    prevSimVars = { ...simVars };
    advanceClockCycle();
    checkBitRanges();
    document.getElementById('stepCounter').textContent = simFinished ? 'DONE' : `CLK ${simStep}`;
    render();
    if (activeTab === 'log')   renderLogPanel();
    if (activeTab === 'vars')  renderVarsPanel();
    if (activeTab === 'table') renderTablePanel();
    if (synthPanelOpen) { renderDatapathPanel(); renderCtrlPanel(); }
    if (simStep > 600) {
      addLog('error', 'Max 600 cycles — possible infinite loop. Press Reset.');
      clearInterval(runInterval); isRunning = false;
      document.getElementById('btnRun').textContent = '▶ Run';
      document.getElementById('btnRun').className = 'btn success';
    }
  };
  runInterval = setInterval(tick, getRunInterval());
}

function saveJSON() {
  const data={
    version:6,
    blocks,
    connections,
    startBlockId,
    userVars,
    combDefaults,
    forcedRegisters:[...forcedRegisters],
    regInitValues,
    varBits,
    varBitDefault,
    simDisplayBase,
    idCounter,
    view
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  let name = prompt('Save as:', 'asm_diagram.json');
  if (name===null) return;
  name = name.trim() || 'asm_diagram.json';
  if (!/\.json$/i.test(name)) name+='.json';
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}
function loadJSON(e) {
  const file=e.target.files[0]; if (!file) return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if (!data.blocks||!data.connections) throw new Error('Not a valid ASM file');
      pushUndo();
      blocks=data.blocks; connections=data.connections;
      startBlockId=data.startBlockId||null; userVars=data.userVars||{};
      combDefaults=data.combDefaults||{};
      forcedRegisters=new Set(data.forcedRegisters||[]);
      regInitValues=data.regInitValues||{};
      varBits=data.varBits||{};
      varBitDefault=data.varBitDefault||8;
      simDisplayBase=data.simDisplayBase||'dec';
      idCounter=data.idCounter||200; view=data.view||{x:0,y:0,scale:1};
      selectedId=null; selectedConnId=null;
      simLog=[];
      revalidateAllBlocks(); render(); updateEmptyState();
      beginSim(); render();
      if (activeTab==='vars')  renderVarsPanel();
      if (activeTab==='log')   renderLogPanel();
      if (activeTab==='table') renderTablePanel();
      if (activeTab==='edit')  renderPanel();
    } catch(err) { alert('Load failed: '+err.message); }
  };
  rd.readAsText(file); e.target.value='';
}

function clearAll() {
  if (!confirm('Clear all blocks and connections?')) return;
  pushUndo();
  blocks=[]; connections=[]; selectedId=null; selectedConnId=null;
  activeBlock=null; startBlockId=null;
  activeTrail=new Set(); activeConnTrail=new Set();
  simStep=0; simVars={}; simLog=[]; userVars={};
  varBits={}; varBitDefault=8; simDisplayBase='dec';
  render(); updateEmptyState(); refreshPanels();
  document.getElementById('stepCounter').textContent='CLK 0';
}
function deleteBlock(id) {
  blocks=blocks.filter(b=>b.id!==id);
  connections=connections.filter(c=>c.from!==id&&c.to!==id);
  if (startBlockId===id) startBlockId = blocks.find(b=>b.type==='state')?.id||null;
  if (selectedId===id) { selectedId=null; renderSideEditor(); }
  liveCircularIds.delete(id);
  liveCodeErrorIds.delete(id);

  // Remove vars no longer assigned anywhere in the design
  const stillAssigned = new Set();
  blocks.forEach(bl => extractAssignedNames(bl.code, { blockType: bl.type }).forEach(n => stillAssigned.add(n)));
  Object.keys(simVars).forEach(varName => {
    if (!stillAssigned.has(varName) && !(varName in userVars)) {
      delete simVars[varName];
      delete combDefaults[varName];
    }
  });

  traceAsmBlock(); evalCombinationalPath();
  render(); updateEmptyState(); refreshPanels();
}

// ASM to verilog export
//pop up window to ask how many bits to export, and also ask which vars to include as outputs
// ASM to verilog export
//pop up window to ask how many bits to export, and also ask which vars to include as outputs
function exportVerilog() {
  // Validate all blocks before export
  const errorBlockNames = [];
  blocks.forEach(b => {
    if (!['state', 'output', 'decision'].includes(b.type)) return;
    const result = b.type === 'decision'
      ? validateDecisionCode(b.code)
      : validateAssignmentCode(b.code, b.type);
    if (!result.valid) errorBlockNames.push(b.name || b.id);
  });
  if (errorBlockNames.length > 0) {
    alert(`Cannot export: ${errorBlockNames.length} block(s) have invalid code (⚠): ${errorBlockNames.join(', ')}.\nFix all errors before exporting.`);
    return;
  }

  // Get all assignable variables
  const registeredNames = getRegisteredVarNames();
  const allAsmAssigned = new Set();
  blocks.forEach(b => extractAssignedNames(b.code, { blockType: b.type }).forEach(n => allAsmAssigned.add(n)));

  const allVars = [...new Set([...Object.keys(userVars), ...allAsmAssigned])];
  const inputVars = allVars.filter(k => !allAsmAssigned.has(k));
  const allVarsExcludingInputs = allVars.filter(v => !inputVars.includes(v));
  if (allVars.length === 0) {
    alert('No variables to select as outputs.');
    return;
  }

  // Prompt only for which vars are internal (not exposed as ports)
  const outputPrompt = `Variables to keep internal (not exposed as module ports), comma-separated.\n\nAvailable: ${allVarsExcludingInputs.join(', ')}\n\nLeave blank to expose all as ports.`;
  const outputStr = prompt(outputPrompt, '');
  if (outputStr === null) return;

  const outputVarList = outputStr
    ? outputStr.split(',').map(v => v.trim()).filter(v => v && allVars.includes(v))
    : [];

  const verilog = generateVerilog(outputVarList);
  const blob = new Blob([verilog], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'asm_diagram.v';
  a.click();
  URL.revokeObjectURL(a.href);
}
 
function getVarBitWidth(v) { return varBits[v] ?? varBitDefault; }
function vBits(v) { const b = getVarBitWidth(v); return b > 1 ? `[${b-1}:0] ` : ''; }
function vLit(v, val) { return `${getVarBitWidth(v)}'d${val}`; }

function generateVerilog(internalVarList = []) {
  if (!blocks.length) { alert('No blocks to export.'); return ''; }
  const registeredNames = getRegisteredVarNames();
  const stateBlocks = blocks.filter(b => b.type === 'state');
  if (!stateBlocks.length) { alert('No state blocks found.'); return ''; }
 
  const stateIdx = {};
  stateBlocks.forEach((b, i) => stateIdx[b.id] = i);
  const startIdx = stateIdx[startBlockId] ?? 0;
 
  const allAsmAssigned = new Set();
  blocks.forEach(b => extractAssignedNames(b.code, { blockType: b.type }).forEach(n => allAsmAssigned.add(n)));
  
  const inputVars = Object.keys(userVars).filter(k => !allAsmAssigned.has(k));
  
 
 
  const internalVars = new Set(internalVarList);

  // module outputs are everything NOT internal
  const moduleOutputs =
    [...allAsmAssigned].filter(v => !internalVars.has(v));

  // registered module outputs
  const outputRegs =
    moduleOutputs.filter(v => registeredNames.has(v));
  //forced promoted
  const forcedRegs = [...allAsmAssigned].filter(v => forcedRegisters.has(v));
  // combinational module outputs
  const combVars =
    [...allAsmAssigned].filter(v => !registeredNames.has(v)).filter(v => !forcedRegisters.has(v));

  // internal registered vars
  const internalRegs =
    [...internalVars].filter(v => registeredNames.has(v));
  
  // internal combinational vars
  const internalCombs =
    [...internalVars].filter(v => !registeredNames.has(v));
  console.log("internalVarList", internalVarList);
  console.log("registeredNames", registeredNames);
  console.log("forcedRegs", forcedRegs);
  console.log("internalCombs", internalCombs);
  const stateBits = Math.max(1, Math.ceil(Math.log2(stateBlocks.length)));
  const stateWidth = stateBits > 1 ? `[${stateBits-1}:0] ` : '';
 
  // Generate localparam line
  let stateParams = 'localparam ';
  stateBlocks.forEach((b, i) => {
    const stateName = `S${i}`;
    const binVal = i.toString(2).padStart(stateBits, '0');
    stateParams += `${stateName} = ${stateBits}'b${binVal}`;
    if (i < stateBlocks.length - 1) stateParams += ', ';
  });
  stateParams += ';';
 
  function walkFromState(stateId) {
    const paths = [];
    function walk(curId, condStack, assignStack, depth) {
      if (depth > 50) return;
      const cur = blocks.find(b => b.id === curId);
      if (!cur) return;
 
      const outConns = connections.filter(c => c.from === curId);
      if (!outConns.length) {
        paths.push({ conds: condStack, assigns: assignStack, nextState: null });
        return;
      }
 
      if (cur.type === 'decision') {
        outConns.forEach(conn => {
          const label = conn.label;
          const isTrue = label === 'true';
          const isFalse = label === 'false';
          let cond = cur.code.trim();
          if (isFalse) cond = `!(${cond})`;
          
          const newConds = [...condStack, cond];
          const nextBlock = blocks.find(b => b.id === conn.to);
          if (!nextBlock) return;
 
          if (nextBlock.type === 'state') {
            const nextStateName = `S${stateIdx[conn.to]}`;
            paths.push({ conds: newConds, assigns: assignStack, nextState: nextStateName });
          } else {
            walk(conn.to, newConds, assignStack, depth + 1);
          }
        });
      } else if (cur.type === 'output') {
        const stmts = splitCodeStatements(cur.code, { blockType: 'output' });
        const newAssigns = [...assignStack];
        stmts.forEach(stmt => {
          const parsed = parseAssignmentStatement(stmt);
          if (parsed) {
            newAssigns.push(`${parsed.lhs} = ${parsed.rhs}`);
          }
        });
        
        const conn = outConns[0];
        const nextBlock = blocks.find(b => b.id === conn.to);
        if (!nextBlock) return;
 
        if (nextBlock.type === 'state') {
          const nextStateName = `S${stateIdx[conn.to]}`;
          paths.push({ conds: condStack, assigns: newAssigns, nextState: nextStateName });
        } else {
          walk(conn.to, condStack, newAssigns, depth + 1);
        }
      } else {
        const conn = outConns[0];
        const nextBlock = blocks.find(b => b.id === conn.to);
        if (nextBlock && nextBlock.type === 'state') {
          const nextStateName = `S${stateIdx[conn.to]}`;
          paths.push({ conds: condStack, assigns: assignStack, nextState: nextStateName });
        } else if (nextBlock) {
          walk(conn.to, condStack, assignStack, depth + 1);
        }
      }
    }
    walk(stateId, [], [], 0);
    return paths;
  }
 
  let stateTransitions = `  always@(posedge clk) begin\n`;
  stateTransitions += `    if (!nrst) begin\n`;
  stateTransitions += `      state <= S${startIdx};\n`;
  stateTransitions += `    end else begin\n`;
  stateTransitions += `      case (state)\n`;
 
  stateBlocks.forEach((stateB, idx) => {
    const stateName = `S${idx}`;
    const paths = walkFromState(stateB.id);
    
    stateTransitions += `        ${stateName}: begin\n`;
 
    if (paths.length === 0 || (paths.length === 1 && paths[0].conds.length === 0 && paths[0].nextState === null)) {
      stateTransitions += `          state <= S${idx};\n`;
    } else if (paths.length === 1 && paths[0].conds.length === 0) {
      stateTransitions += `          state <= ${paths[0].nextState};\n`;
    } else {
      paths.forEach((p, pi) => {
        if (p.conds.length === 0 && p.nextState !== null) {
          stateTransitions += `          state <= ${p.nextState};\n`;
        } else if (p.conds.length > 0 && p.nextState !== null) {
          const guard = p.conds.join(' && ');
          const keyword = pi === 0 ? 'if' : 'else if';
          stateTransitions += `          ${keyword} (${guard}) begin\n`;
          stateTransitions += `            state <= ${p.nextState};\n`;
          stateTransitions += `          end\n`;
        }
      });
    }
 
    stateTransitions += `        end\n`;
  });
 
  stateTransitions += `        default: begin\n`;
  stateTransitions += `          state <= S${startIdx};\n`;
  stateTransitions += `        end\n`;
  stateTransitions += `      endcase\n`;
  stateTransitions += `    end\n`;
  stateTransitions += `  end\n`;
 
  let stateAssignments = `  always@(posedge clk) begin\n`;
  stateAssignments += `    if (!nrst) begin\n`;
  
  // Initialize all registered vars (outputs + internals)
  [...registeredNames].forEach(v => {
    const init = (v in regInitValues) ? regInitValues[v] : 0;
    stateAssignments += `      ${v} <= ${vLit(v, init)};\n`;
  });
  
  stateAssignments += `    end else begin\n`;
  stateAssignments += `      case (state)\n`;
 
  stateBlocks.forEach((stateB, idx) => {
    const stateName = `S${idx}`;
    const stmts = splitCodeStatements(stateB.code, { blockType: 'state' });
    
    stateAssignments += `        ${stateName}: begin\n`;
    if (stmts.length > 0) {
      stmts.forEach(stmt => {
        const parsed = parseAssignmentStatement(stmt);
        if (parsed) {
          stateAssignments += `          ${parsed.lhs} <= ${parsed.rhs};\n`;
        }
      });
    }
    stateAssignments += `        end\n`;
  });
 
  stateAssignments += `      endcase\n`;
  stateAssignments += `    end\n`;
  stateAssignments += `  end\n`;
 
  let combOutputs = '';


  if (combVars.length > 0) {
    combOutputs = `  // Combinational outputs\n`;
    combOutputs += `  always@(*) begin\n`;
 
    const combPathsByVar = {};
    stateBlocks.forEach((stateB, idx) => {
      const stateName = `S${idx}`;
      const paths = walkFromState(stateB.id);
 
      paths.forEach((p) => {
        p.assigns.forEach(assign => {
          const parsed = parseAssignmentStatement(assign);
          if (parsed && combVars.includes(parsed.lhs)) {
            const varName = parsed.lhs;
            if (!combPathsByVar[varName]) combPathsByVar[varName] = [];
            
            const guard = p.conds.length > 0 
              ? `((state == ${stateName}) && (${p.conds.join(' && ')}))`
              : `(state == ${stateName})`;
            combPathsByVar[varName].push({ guard, rhs: parsed.rhs });
          }
        });
      });
    });
 
    combVars.forEach(v => {
      const paths = combPathsByVar[v] || [];
      const def = (v in combDefaults) ? combDefaults[v] : 0;
 
      if (paths.length === 0) {
        combOutputs += `    ${v} = ${vLit(v, def)};\n`;
      } else {
        paths.forEach((p, pi) => {
          const keyword = pi === 0 ? 'if' : 'else if';
          combOutputs += `    ${keyword} ${p.guard} begin\n`;
          combOutputs += `      ${v} = ${p.rhs};\n`;
          combOutputs += `    end\n`;
        });
        combOutputs += `    else begin\n`;
        combOutputs += `      ${v} = ${vLit(v, def)};\n`;
        combOutputs += `    end\n`;
      }
    });
 
    combOutputs += `  end\n`;
  }
 //internal comb var
  let internalOutputs = '';
  if (forcedRegs.length > 0) {
    internalOutputs = `  // Regs Combinational outputs\n`;
    internalOutputs += `  always@(posedge clk) begin\n`;
    internalOutputs += `    if (!nrst) begin\n`;
    
    const internalCombPathsByVar = {};
    stateBlocks.forEach((stateB, idx) => {
      const stateName = `S${idx}`;
      const paths = walkFromState(stateB.id);
 
      paths.forEach((p) => {
        p.assigns.forEach(assign => {
          const parsed = parseAssignmentStatement(assign);
          if (parsed && forcedRegs.includes(parsed.lhs)) {
            const varName = parsed.lhs;
            if (!internalCombPathsByVar[varName]) internalCombPathsByVar[varName] = [];
            
            const guard = p.conds.length > 0 
              ? `((state == ${stateName}) && (${p.conds.join(' && ')}))`
              : `(state == ${stateName})`;
            internalCombPathsByVar[varName].push({ guard, rhs: parsed.rhs });
          }
        });
      });
    });
 
    forcedRegs.forEach(v => {
      const paths = internalCombPathsByVar[v] || [];
      const def = (v in combDefaults) ? combDefaults[v] : 0;
 
      if (paths.length === 0) {
        internalOutputs += `    ${v} <= ${vLit(v, def)};\n`;
      } else {
        internalOutputs += `        ${v} <= ${vLit(v, def)};\n`;
        internalOutputs += `    end else begin\n`;
        paths.forEach((p, pi) => {
          const keyword = pi === 0 ? 'if' : 'else if';
          internalOutputs += `      ${keyword} ${p.guard} begin\n`;
          internalOutputs += `        ${v} <= ${vLit(v, p.rhs)};\n`;
          internalOutputs += `      end\n`;
        });
        internalOutputs += `    end\n`;
        
      }
    });
 
    internalOutputs += `  end\n`;
  }  

  
  // Build module
  let module = `module asm (\n`;
  
  // Input ports
  module += inputVars.map(v => `  input ${vBits(v)}${v}`).join(',\n');
  if (inputVars.length > 0) module += ',\n';

  // Control ports
  module += `  input nrst,\n`;
  module += `  input clk`;

  // Output ports
  if (outputRegs.length > 0) module += ',\n';

  module += outputRegs
  .map(v => `  output reg ${vBits(v)}${v}`)
  .join(',\n');

  if (combVars.length > 0 && outputRegs.length > 0) module += ',\n';

  module += combVars.filter(v => !internalCombs.includes(v))
  .map(v => `  output reg ${vBits(v)}${v}`)
  .join(',\n');


  module += `);\n\n`;


  // Internal registered vars
  if (internalRegs.length > 0) {
    internalRegs.forEach(v => {
      module += `  reg ${vBits(v)}${v};\n`;
    });
  }

  // Internal combinational vars
  if (internalCombs.length > 0) {
    internalCombs.forEach(v => {
      module += `  reg ${vBits(v)}${v};\n`;
    });
  }
  
  module += `  reg ${stateWidth}state;\n\n`;
  module += `  // state names\n`;
  module += stateParams + '\n\n';
  module += `  // state transitions\n`;
  module += stateTransitions + '\n';
  module += `  // state box assignments\n`;
  module += stateAssignments + '\n';
  if (combOutputs) module += combOutputs + '\n';
  if (internalCombs) module += internalOutputs + '\n';
  module += `endmodule\n`;
 
  return module;
}
function updateEmptyState() {
  document.getElementById('emptyState').style.display=blocks.length?'none':'block';
}
function clip(str, maxPx) {
  if (!str) return '';
  str=str.trim();
  const max=Math.floor(maxPx/6.2);
  return str.length>max ? str.slice(0,max-1)+'…' : str;
}
function toggleTheme() {
  document.body.classList.toggle('light');
  document.getElementById('themeIcon').textContent = document.body.classList.contains('light') ? '🌙' : '☀';
  render(); // labelColor()/subLabelColor() re-evaluated immediately
}
function toggleMenu(id) {
  const m=document.getElementById(id); if(!m) return;
  const will=!m.classList.contains('open');
  closeMenus();
  if(will) m.classList.add('open');
}
function closeMenus() { document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')); }
function handleMenu(fn) { closeMenus(); fn(); }
function isInfoDialogOpen() {
  return document.getElementById('infoOverlay')?.classList.contains('open');
}
function openInfoDialog(kind) {
  closeMenus();
  const info = INFO_DIALOGS[kind] || INFO_DIALOGS.help;
  const overlay = document.getElementById('infoOverlay');
  const titleEl = document.getElementById('infoTitle');
  const bodyEl = document.getElementById('infoBody');
  if (!overlay || !titleEl || !bodyEl) return;
  titleEl.textContent = info.title;
  bodyEl.innerHTML = info.body;
  overlay.classList.add('open');
}
function closeInfoDialog() {
  const overlay = document.getElementById('infoOverlay');
  if (overlay) overlay.classList.remove('open');
}
function handleInfoOverlayClick(event) {
  if (event.target.id === 'infoOverlay') closeInfoDialog();
}

// Theme-aware label colors for SVG text (can't use CSS vars directly in SVG attributes)
function labelColor()    { return document.body.classList.contains('light') ? '#151b2c' : '#e2e4f0'; }
function subLabelColor() { return document.body.classList.contains('light') ? '#475569' : '#7a86a8'; }

// SVG helpers
function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg',tag); }
function setA(el,attrs) { for(const[k,v]of Object.entries(attrs))el.setAttribute(k,String(v));return el; }
function sv(tag,attrs) { return setA(ns(tag),attrs); }
function txt(x,y,str,fill,size,weight) {
  const t=ns('text');
  setA(t,{x,y,'text-anchor':'middle','dominant-baseline':'central',fill,'font-size':size,'font-weight':weight,'font-family':"'JetBrains Mono',monospace"});
  t.textContent=str; return t;
}
function h(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
