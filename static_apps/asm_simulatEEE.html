<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASM Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0d0f14; --bg2:#141720; --bg3:#1c2030; --bg4:#242840;
  --border:#2a2f45; --border2:#3a4060;
  --text:#e2e4f0; --text2:#8890b0; --text3:#555e80;
  --accent:#4f9eff; --accent2:#2d7dd2;
  --green:#3ecf8e; --amber:#f5a623; --red:#ff5c5c; --purple:#a78bfa;
  --mono:'JetBrains Mono',monospace; --sans:'Space Grotesk',sans-serif;
}
body.light {
  --bg:#f7f8fc; --bg2:#ffffff; --bg3:#f2f4fa; --bg4:#e9edf7;
  --border:#d6dbea; --border2:#c1c7db;
  --text:#151b2c; --text2:#334155; --text3:#475569;
  --accent:#2563eb; --accent2:#1d4ed8;
  --green:#128a58; --amber:#c16a00; --red:#d83a3a; --purple:#6d28d9;
}
body { font-family:var(--sans); background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

header { height:52px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 14px; gap:8px; flex-shrink:0; z-index:100; flex-wrap:wrap; }
.logo { font-family:var(--mono); font-weight:700; font-size:20px; color:var(--accent); letter-spacing:2px; white-space:nowrap; }
.logo span { color:var(--text2); font-weight:400; }
.header-sep { flex:1; min-width:8px; }

/* Menu */
.menu-bar { display:flex; align-items:center; gap:2px; }
.menu { position:relative; }
.menu-btn { font-family:var(--sans); font-size:18px; font-weight:500; padding:5px 10px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--text2); cursor:pointer; transition:all .15s; white-space:nowrap; }
.menu-btn:hover, .menu.open .menu-btn { background:var(--bg3); border-color:var(--border2); color:var(--text); }
.menu-btn.active { color:var(--accent); border-color:var(--accent); background:var(--bg3); border-bottom-width:2px; }
.menu-dropdown { position:absolute; top:calc(100%+6px); left:0; min-width:190px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:6px; box-shadow:0 12px 30px rgba(0,0,0,.3); display:none; z-index:200; }
.menu.open .menu-dropdown { display:block; }
.menu-item { width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; border:none; border-radius:7px; background:transparent; color:var(--text); font-family:var(--sans); font-size:18px; text-align:left; cursor:pointer; white-space:nowrap; }
.menu-item:hover { background:var(--bg3); }
.menu-item-icon { width:14px; text-align:center; flex-shrink:0; color:var(--accent); }
.menu-item-kbd { margin-left:auto; font-family:var(--mono); font-size:16px; color:var(--text3); }
.menu-divider { height:1px; background:var(--border); margin:4px 2px; }
.info-overlay { position:fixed; inset:0; background:rgba(8,12,20,.62); display:none; align-items:center; justify-content:center; padding:24px; z-index:400; }
.info-overlay.open { display:flex; }
.info-dialog { width:min(640px, 100%); max-height:min(82vh, 760px); overflow:auto; background:var(--bg2); border:1px solid var(--border2); border-radius:18px; box-shadow:0 24px 60px rgba(0,0,0,.38); padding:18px 18px 16px; }
.info-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.info-title { font-size:24px; font-weight:600; color:var(--text); }
.info-close { margin-left:auto; }
.info-body { color:var(--text2); font-size:17px; line-height:1.65; }
.info-body p + p { margin-top:10px; }
.info-body h3 { margin-top:16px; color:var(--text); font-size:18px; }
.info-body ul { margin:10px 0 0 20px; }
.info-body li + li { margin-top:6px; }
.info-body code { font-family:var(--mono); color:var(--accent); }

.btn { font-family:var(--sans); font-size:18px; font-weight:500; padding:5px 11px; border-radius:6px; border:1px solid var(--border2); background:var(--bg3); color:var(--text); cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px; white-space:nowrap; }
.btn:hover { background:var(--bg4); border-color:var(--accent); color:var(--accent); }
.btn.primary { background:var(--accent2); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:var(--accent); }
.btn.danger { border-color:var(--red); color:var(--red); }
.btn.danger:hover { background:rgba(255,92,92,.1); }
.btn.success { background:rgba(62,207,142,.15); border-color:var(--green); color:var(--green); }
.btn.success:hover { background:rgba(62,207,142,.25); }
.btn.active { background:var(--accent2); border-color:var(--accent); color:#fff; }

.sim-controls { display:flex; align-items:center; gap:6px; }
.step-counter { font-family:var(--mono); font-size:18px; color:var(--text2); padding:5px 11px; background:var(--bg3); border:1px solid var(--border); border-radius:6px; min-width:78px; text-align:center; }

/* Speed control */
.speed-wrap { display:flex; align-items:center; gap:5px; }
.speed-wrap label { font-size:16px; color:var(--text3); white-space:nowrap; }
.speed-wrap input[type=range] { width:64px; accent-color:var(--accent); cursor:pointer; }

.main { flex:1; display:flex; overflow:hidden; }

/* SIDEBAR */
.sidebar { width:210px; min-width:140px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
.sidebar-resizer { width:5px; background:transparent; cursor:col-resize; flex-shrink:0; transition:background .15s; z-index:10; }
.sidebar-resizer:hover, .sidebar-resizer.dragging { background:var(--accent); }
.sidebar-section { padding:11px; border-bottom:1px solid var(--border); }
.sidebar-label { font-size:16px; font-weight:600; color:var(--text3); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:9px; }
.block-item { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:6px; border:1px solid var(--border); background:var(--bg3); cursor:grab; margin-bottom:5px; transition:all .15s; font-size:18px; font-weight:500; user-select:none; }
.block-item:hover { border-color:var(--accent); color:var(--accent); }
.block-item:active { cursor:grabbing; }
.block-icon { width:18px; height:18px; flex-shrink:0; }

/* CANVAS */
.canvas-wrap { flex:1; position:relative; overflow:hidden; background:var(--bg); background-image:radial-gradient(circle, var(--border) 1px, transparent 1px); background-size:24px 24px; }
#canvas { position:absolute; top:0; left:0; width:100%; height:100%; cursor:default; }

/* RIGHT PANEL */
.right-panel { width:268px; min-width:380px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.right-panel-resizer { width:5px; background:transparent; cursor:col-resize; flex-shrink:0; transition:background .15s; z-index:10; }
.right-panel-resizer:hover, .right-panel-resizer.dragging { background:var(--accent); }
.panel-tabs { display:flex; border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0; }
.panel-tabs::-webkit-scrollbar { height:3px; }
.panel-tab { flex-shrink:0; padding:9px 11px; text-align:center; font-size:16px; font-weight:600; color:var(--text2); cursor:pointer; letter-spacing:.5px; transition:all .15s; border-bottom:2px solid transparent; white-space:nowrap; }
.panel-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.panel-content { flex:1; overflow-y:auto; padding:11px; }
/* SYNTH BOTTOM PANEL */
.synth-resizer { height:5px; background:transparent; cursor:row-resize; flex-shrink:0; transition:background .15s; z-index:10; }
.synth-resizer:hover, .synth-resizer.dragging { background:var(--accent); }
.synth-panel { flex-shrink:0; display:flex; flex-direction:column; border-top:2px solid var(--accent); background:var(--bg2); height:310px; }
.synth-panel-bar { display:flex; align-items:center; gap:0; padding:0; border-bottom:1px solid var(--border); background:var(--bg3); flex-shrink:0; height:30px; }
.synth-panel-title { flex:1; padding:0 12px; font-size:15px; font-weight:700; letter-spacing:.5px; color:var(--accent); display:flex; align-items:center; }
.synth-panel-title + .synth-panel-title { border-left:1px solid var(--border); color:var(--purple); }
.synth-panel-close { border:none; background:transparent; color:var(--text3); cursor:pointer; padding:0 10px; font-size:17px; height:100%; flex-shrink:0; }
.synth-panel-close:hover { color:var(--text); }
.synth-panel-body { flex:1; display:flex; overflow:hidden; }
.synth-pane { flex:1; overflow:auto; padding:10px 12px; min-width:80px; }
.synth-pane-resizer { width:5px; background:transparent; cursor:col-resize; flex-shrink:0; transition:background .15s; z-index:10; }
.synth-pane-resizer:hover, .synth-pane-resizer.dragging { background:var(--accent); }

/* EDITOR */
.editor-section { margin-bottom:13px; }
.editor-label { font-size:16px; font-weight:600; color:var(--text3);flex-direction:column; align-items:left; letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; display:flex;  gap:5px; }
.editor-input { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:var(--mono); font-size:18px; padding:7px 9px; outline:none; resize:vertical; transition:border-color .15s; }
.editor-input:focus { border-color:var(--accent); }
.editor-hint { font-size:16px; color:var(--text3); margin-top:4px; font-family:var(--mono); line-height:1.5; white-space:pre; }

.code-error-box { display:none; background:rgba(255,92,92,.08); border:1px solid var(--red); border-radius:6px; padding:8px 10px; margin-top:6px; font-size:15px; color:var(--red); line-height:1.5; }
.error-item { margin-bottom:6px; }
.error-item:last-child { margin-bottom:0; }
.error-item code { background:rgba(255,92,92,.12); padding:2px 5px; border-radius:3px; font-family:var(--mono); font-size:14px; color:var(--red); }

.code-validation-badge { display:inline-block; margin-left:8px; padding:3px 8px; border-radius:4px; font-size:14px; font-weight:600; }
.code-validation-badge.valid { color:var(--green); background:rgba(62,207,142,.1); }
.code-validation-badge.error { color:var(--red); background:rgba(255,92,92,.1); }

/* VARS */
.var-row { display:flex; align-items:center; padding:5px 0; border-bottom:1px solid var(--border); font-size:18px; gap:5px; }
@keyframes varFlash {
  0%   { background: rgba(62,207,142,0.35); border-radius:4px; }
  100% { background: transparent; }
}
.var-changed { animation: varFlash 1.4s ease-out forwards; }
.var-name { font-family:var(--mono); color:var(--purple); }
.var-val { font-family:var(--mono); color:var(--green); font-weight:500; }

/* LOG */
.log-entry { font-family:var(--mono); font-size:16.5px; padding:3px 0; border-bottom:1px solid var(--border); color:var(--text2); display:flex; gap:7px; }
.log-entry .log-step { color:var(--text3); min-width:28px; flex-shrink:0; }
.log-entry.active  { color:var(--green); }
.log-entry.decision{ color:var(--amber); }
.log-entry.output  { color:var(--purple); }
.log-entry.error   { color:var(--red); }

/* TABLE */
.asm-table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:17px; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.asm-table th { background:var(--bg3); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); text-align:center; color:var(--text2); white-space:nowrap; }
.asm-table th:last-child { border-right:none; }
.asm-table td { padding:5px 8px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); color:var(--text2); white-space:nowrap; text-align:center; }
.asm-table td:last-child { border-right:none; }
.asm-table tr:last-child td { border-bottom:none; }
.asm-table tr.tbl-active td { background:rgba(79,158,255,.15); color:var(--text); }
.asm-table tr:nth-child(even):not(.tbl-active) td { background:rgba(79,158,255,.03); }

/* EMPTY */
.empty-state { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
.empty-state h2 { font-size:18px; color:var(--text3); font-weight:500; margin-bottom:8px; }
.empty-state p { font-size:15px; color:var(--text3); }
.var-type-btn {
  font-size:12px; padding:2px 8px; border-radius:10px;
  border:1px solid var(--border2); background:var(--bg4);
  color:var(--text3); cursor:pointer; font-family:var(--sans);
  transition:all .15s; margin-top:3px; white-space:nowrap;
}
.var-type-btn:hover { border-color:var(--accent); color:var(--accent); }
.var-base-btn {
  font-size:11px; padding:1px 6px; border-radius:8px;
  border:1px solid var(--border2); background:var(--bg4);
  color:var(--text3); cursor:pointer; font-family:var(--mono);
  transition:all .15s; white-space:nowrap; flex-shrink:0;
}
.var-base-btn:hover { border-color:var(--amber); color:var(--amber); }
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
.var-add-row { display:flex; gap:5px; margin-bottom:9px; }
</style>
</head>
<body>

<header>
  <div class="logo">ASM<span> // SIM</span></div>

  <!-- File menu -->
  <div class="menu-bar">
    <div class="menu" id="menuFile">
      <button class="menu-btn" onclick="toggleMenu('menuFile')">File</button>
      <div class="menu-dropdown">
        <button class="menu-item" onclick="handleMenu(saveJSON)"><span class="menu-item-icon">⬇</span>Save JSON<span class="menu-item-kbd">Ctrl+S</span></button>
        <button class="menu-item" onclick="handleMenu(()=>document.getElementById('fileInput').click())"><span class="menu-item-icon">⬆</span>Load JSON<span class="menu-item-kbd">Ctrl+O</span></button>
        <button class="menu-item" onclick="handleMenu(exportVerilog)"><span class="menu-item-icon">📤</span>Export Verilog</button>
        <div class="menu-divider"></div>
        <button class="menu-item" onclick="handleMenu(clearAll)"><span class="menu-item-icon" style="color:var(--red)">✕</span>Clear Canvas</button>
      </div>
    </div>
    <div class="menu" id="menuEdit">
      <button class="menu-btn" onclick="toggleMenu('menuEdit')">Edit</button>
      <div class="menu-dropdown">
        <button class="menu-item" onclick="handleMenu(undo)"><span class="menu-item-icon">↩</span>Undo<span class="menu-item-kbd">Ctrl+Z</span></button>
        <button class="menu-item" onclick="handleMenu(redo)"><span class="menu-item-icon">↪</span>Redo<span class="menu-item-kbd">Ctrl+Y</span></button>
        <div class="menu-divider"></div>
        
      </div>
    </div>
    <div class="menu" id="menuView">
      <button class="menu-btn" onclick="toggleMenu('menuView')">View</button>
      <div class="menu-dropdown">
        <button class="menu-item" onclick="handleMenu(toggleTheme)"><span class="menu-item-icon" id="themeIcon">☀</span>Toggle Theme</button>
        <button class="menu-item" onclick="handleMenu(centerCanvas)"><span class="menu-item-icon">⊕</span>Center Canvas</button>
        <button class="menu-item" onclick="handleMenu(()=>setZoom(1))"><span class="menu-item-icon">⊡</span>Reset Zoom</button>
      </div>
    </div>
    <button class="menu-btn" onclick="openInfoDialog('ASM_reference')">ASM Reference</button>
    <button class="menu-btn" onclick="openInfoDialog('ops')">Supported Operations</button>
    
    <button class="menu-btn" onclick="openInfoDialog('help')">Help</button>
    <button class="menu-btn" onclick="openInfoDialog('about')">About</button>
  </div>

  <div class="header-sep"></div>

  <div class="sim-controls">
    <div class="step-counter" id="stepCounter">CLK 0</div>
    <button class="btn" onclick="resetSim()" title="Reset (R)">↺ Reset</button>
    <button class="btn" onclick="stepBack()" title="Step back one clock cycle">← Back</button>
    <button class="btn" onclick="stepSim()" title="Step one clock cycle (Space)">→ Step</button>
    <button class="btn success" id="btnRun" onclick="runSim()" title="Run / Stop">▶ Run</button>
    <div class="speed-wrap">
      <label>Speed</label>
      <input type="range" id="speedSlider" min="1" max="10" value="5" title="Simulation speed">
    
</header>

<div class="info-overlay" id="infoOverlay" onclick="handleInfoOverlayClick(event)">
  <div class="info-dialog" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="info-head">
      <div class="info-title" id="infoTitle">Info</div>
      <button class="btn info-close" onclick="closeInfoDialog()">Close</button>
    </div>
    <div class="info-body" id="infoBody"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadJSON(event)">

<div class="main">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Blocks</div>
      <div class="block-item" draggable="true" ondragstart="dragStart(event,'state')">
        <svg class="block-icon" viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="12" rx="2" fill="none" stroke="#4f9eff" stroke-width="1.5"/><line x1="2" y1="8" x2="18" y2="8" stroke="#4f9eff" stroke-width="1"/></svg>
        <div><div style="font-size:18px">State Box</div><div style="font-size:14px;color:var(--text3)"></div></div>
      </div>
      <div class="block-item" draggable="true" ondragstart="dragStart(event,'decision')">
        <svg class="block-icon" viewBox="0 0 20 20"><polygon points="10,2 18,10 10,18 2,10" fill="none" stroke="#f5a623" stroke-width="1.5"/></svg>
        <div><div style="font-size:18px">Decision Box</div><div style="font-size:14px;color:var(--text3)"></div></div>
      </div>
      <div class="block-item" draggable="true" ondragstart="dragStart(event,'output')">
        <svg class="block-icon" viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="10" rx="5" fill="none" stroke="#a78bfa" stroke-width="1.5"/></svg>
        <div><div style="font-size:18px">Cond. Output</div><div style="font-size:14px;color:var(--text3)"></div></div>
      </div>
    </div>
    <div class="sidebar-section">
      <!--<div class="sidebar-label">Tips</div>
      <div style="font-size:10.5px;color:var(--text2);line-height:1.85">
        • Drag blocks to canvas<br>
        • Scroll to zoom, drag to pan<br>
        • Click block → edit code<br>
        • Drag edge dots to wire<br>
        • <span style="color:var(--accent)">Drag ● midpoint</span> to reroute<br>
        • Wire to self = loop<br>
        • Drag corner to resize<br>
        • Double-click to delete<br>
        • Del key deletes selected<br>
        • Ctrl+Z / Ctrl+Y undo/redo
      </div>-->
    </div>
 
    <!-- EDITOR lives here in the sidebar -->
    <div class="sidebar-section" id="sideEditor" style="flex:1;overflow-y:auto;border-bottom:none">
      <div style="color:var(--text3);font-size:17px;padding:8px 0;text-align:center">Click a block to edit</div>
    </div>
  </div>

  <!-- CANVAS -->
  <div class="sidebar-resizer" id="sidebarResizer"></div>

  <div class="canvas-wrap" id="canvasWrap"
       ondragover="event.preventDefault()" ondrop="dropBlock(event)">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="empty-state" id="emptyState">
      <h2>Drop blocks here</h2>
      <p>Drag State, Decision, or Output blocks from the left panel</p>
    </div>
  </div>

  <div class="right-panel-resizer" id="rightPanelResizer"></div>

  <!-- RIGHT PANEL -->
  <div class="right-panel" id="rightPanel">
    <div class="panel-tabs">
      <div class="panel-tab active" id="tabVars"  onclick="switchTab('vars')">VARS</div>
      <div class="panel-tab"        id="tabLog"   onclick="switchTab('log')">LOG</div>
      <button class="menu-btn" id="btnSynth" onclick="toggleSynthPanel()">SYNTHESIZE</button>
    </div>
    <div class="panel-content" id="panelContent">
      <div style="color:var(--text3);font-size:18px;padding:20px 0;text-align:center">Set variables then run</div>
    </div>
  </div>
</div>

<!-- SYNTHESIS BOTTOM PANEL -->
<div class="synth-resizer" id="synthResizer" style="display:none"></div>
<div class="synth-panel" id="synthPanel" style="display:none">
  <div class="synth-panel-bar">
    <div class="synth-panel-title">DATAPATH</div>
    <div class="synth-panel-title">CONTROLLER</div>
    <button class="synth-panel-close" onclick="toggleSynthPanel()" title="Close">✕</button>
  </div>
  <div class="synth-panel-body">
    <div class="synth-pane" id="synthDpath"></div>
    <div class="synth-pane-resizer" id="synthPaneResizer"></div>
    <div class="synth-pane" id="synthCtrl"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let blocks      = [];   // { id, type, x, y, w, h, name, code }
let connections = [];   // { id, from, to, label, mx, my, loopOff }
let startBlockId = null; // which state block is the sim start
let selectedId   = null;
let selectedConnId = null;
let activeTab = 'vars';
let simStep      = 0;
let simVars      = {};
let userVars     = {};
let simLog       = [];
let activeBlock  = null;  // current state block we're sitting in
let activeTrail      = new Set();
let activeConnTrail  = new Set();
let isRunning    = false;
let runInterval  = null;
let idCounter    = 1;
let lastCycleFingerprint = null;
let loopRepeatCount = 0;
let simFinished = false;
let stepHistory = [];  // for step-back
let combDefaults = {};            // { varName: defaultValue } for purely-comb vars

      <p>1) At any given time, you are in a state box. That is your current state. You would move from one state box to another state box every ASM step (one clock cycle).
<br><br>
2) A variable can be treated as a register or combinational logic. The distinction depends on how this variable is assigned within the ASM.
<br><br>
2A) If a variable is assigned inside a state box, it is inferred as a register. All assignments to a register take effect on the next positive edge of the clock (since it is a register/flip-flop). That is, the update only happens as you transition into a new state. The update is delayed by 1 cycle, effectively.
<br><br>
2B) A variable only assigned inside a conditional box (it is not assigned in any state box in the ASM) is, by default, a combinational logic (not a register). A combinational logic assignment would take effect right away (that is, it does not need to wait for the positive edge of the clock).
<br><br>
2C) A variable only assigned inside a conditional box (it is not assigned in any state box in the ASM) can also be declared as a register. This has to be explicitly stated together with the ASM (since you would not know it is a register otherwise, as it is not assigned in a state box following rule #2A). If it is declared as a register, then the assignment would take effect on the next positive edge of the clock (typical register/flip-flop behavior).
 <br><br>
3) A variable, whether register or combinational, can only be assigned once in every ASM step. An ASM step is basically the evaluation of the assignments starting from a state box (the current state), going through all the decision and conditional boxes until you reach the input to another state box. An ASM step is one clock cycle. A variable assigned more than once within a step will lead to an error, as assignments within an ASM step are evaluated concurrently, not sequentially.
<br><br>
4) If a variable is not assigned within an ASM step, the behavior depends on whether it is a register or a combinational output. If the variable is a register, the previous value of that register (or its initial value, also defined with the ASM) is held during that step/clock cycle. If the variable is a combinational output, the value would default to 0 (unless the default value was otherwise stated with the ASM).
<br><br>
5) Conditional boxes are typically drawn after decision boxes to represent different assignments depending on some condition. However, you may also put conditional boxes right after a state box. You would do this if you want a combinational output behavior for a variable (i.e., you don't want to declare it as a register, but you want to assign values to it).

let svgEl, canvasWrap;

// ── View (pan / zoom) ───────────────────────────────────
let view = { x:0, y:0, scale:2 };

const UNDO_LIMIT = 60;

// ── Block geometry defaults ─────────────────────────────

//  INIT
// ════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  svgEl      = document.getElementById('canvas');
  canvasWrap = document.getElementById('canvasWrap');

  svgEl.addEventListener('click', e => {
    if (e.target === svgEl) {
      selectedId = null; selectedConnId = null;
      render(); renderPanel();
    }
  });

  // Pan on empty canvas
  svgEl.addEventListener('mousedown', e => {
    if (e.target !== svgEl) return;
    e.preventDefault();
    let lx = e.clientX, ly = e.clientY;
    const move = ev => {
      view.x -= (ev.clientX - lx) / view.scale;
      view.y -= (ev.clientY - ly) / view.scale;
      lx = ev.clientX; ly = ev.clientY;
      render();
    };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });

  // Scroll to zoom
  canvasWrap.addEventListener('wheel', e => {
    e.preventDefault();
    const r   = canvasWrap.getBoundingClientRect();
    const mx  = e.clientX - r.left;
    const my  = e.clientY - r.top;
    const wx  = view.x + mx / view.scale;
    const wy  = view.y + my / view.scale;
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    view.scale = Math.max(0.2, Math.min(4, view.scale * factor));
    view.x = wx - mx / view.scale;
    view.y = wy - my / view.scale;
    render();
  }, { passive: false });

  // Right panel resize
  const rightPanelEl = document.querySelector('.right-panel');
  const rightResizerEl = document.getElementById('rightPanelResizer');
  rightResizerEl.addEventListener('mousedown', e => {
    e.preventDefault();
    rightResizerEl.classList.add('dragging');
    const startX = e.clientX, startW = rightPanelEl.offsetWidth;
    const onMove = ev => {
      const newW = Math.max(180, startW - (ev.clientX - startX));
      rightPanelEl.style.width = newW + 'px';
    };
    const onUp = () => {
      rightResizerEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Sidebar resize
  const sidebarEl = document.querySelector('.sidebar');
  const resizerEl = document.getElementById('sidebarResizer');
  resizerEl.addEventListener('mousedown', e => {
    e.preventDefault();
    resizerEl.classList.add('dragging');
    const startX = e.clientX, startW = sidebarEl.offsetWidth;
    const onMove = ev => {
      const newW = Math.max(140, startW + ev.clientX - startX);
      sidebarEl.style.width = newW + 'px';
    };
    const onUp = () => {
      resizerEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Synth pane horizontal resize (DPATH / CTRL split)
  const synthDpathEl     = document.getElementById('synthDpath');

  const synthPaneResizerEl = document.getElementById('synthPaneResizer');

    e.preventDefault();
    synthPaneResizerEl.classList.add('dragging');
    const startX = e.clientX, startW = synthDpathEl.offsetWidth;
    const onMove = ev => {
      const bodyW = synthDpathEl.parentElement.offsetWidth;
      const newW  = Math.max(80, Math.min(bodyW - 80 - 5, startW + (ev.clientX - startX)));
      synthDpathEl.style.flex = 'none';
      synthDpathEl.style.width = newW + 'px';
      synthCtrlEl.style.flex = '1';
    };
    const onUp = () => {
      synthPaneResizerEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Synth panel vertical resize
  const synthPanelEl   = document.getElementById('synthPanel');
  const synthResizerEl = document.getElementById('synthResizer');
  synthResizerEl.addEventListener('mousedown', e => {
    e.preventDefault();
    synthResizerEl.classList.add('dragging');
    const startY = e.clientY, startH = synthPanelEl.offsetHeight;
    const onMove = ev => {
      const newH = Math.max(120, Math.min(window.innerHeight - 120, startH - (ev.clientY - startY)));
      synthPanelEl.style.height = newH + 'px';
    };
    const onUp = () => {
      synthResizerEl.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Close menus on outside click
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu')) closeMenus();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName || '';
    if (e.key === 'Escape') {
      if (isInfoDialogOpen()) { closeInfoDialog(); return; }
      closeMenus(); selectedId = null; selectedConnId = null; render(); renderPanel(); return;
    }
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
    if (e.ctrlKey && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); return; }
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveJSON(); return; }
    if (e.ctrlKey && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); document.getElementById('fileInput').click(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) { e.preventDefault(); deleteBlock(selectedId); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedConnId) { e.preventDefault(); removeConn(selectedConnId); return; }
    if (e.key === ' ') { e.preventDefault(); stepSim(); return; }
    if (e.key === 'r' || e.key === 'R') { resetSim(); return; }
    if (e.shiftKey && e.key === ' ') { e.preventDefault(); stepBack(); return; }
    // Arrow key pan
    const step = (e.shiftKey ? 80 : 32) / view.scale;
    if (e.key === 'ArrowLeft')  { view.x -= step; render(); }
    if (e.key === 'ArrowRight') { view.x += step; render(); }
    if (e.key === 'ArrowUp')    { view.y -= step; render(); }
    if (e.key === 'ArrowDown')  { view.y += step; render(); }
  });

  initDefault();
});

function initDefault() {
  // a, b are registers (assigned in state boxes)
  // done is purely combinational (only assigned in conditional output box)
  const b1 = addBlockAt('state',    155,  0, 'S0', 'a = 0;\nb = n;');
  const b2 = addBlockAt('decision', 160, 200, 'D0', 'b > 0');
  const b3 = addBlockAt('output',   360, 290, 'C0', 'done = 1;');
  const b4 = addBlockAt('state',    31, 389, 'S1', 'a = a + x;\nb = b - 1;');
  const b5 = addBlockAt('state',    510, 200, 'S2', 'result = a-x;');
  
  const b11 = addBlockAt('state',    156, 98, 'S3', 'result = a;');
  const b17 = addBlockAt('output',    428, 57, 'C1', 'done = 1;');
  const c1 = mkConn(b2, b4, 'true');
  c1.mx = 130;
  c1.my = 318;
  connections.push(c1);
  const c2 = mkConn(b4, b2);
  c2.mx = 211;
  c2.my = 365;
  connections.push(c2);
  //connections.push(mkConn(b2, b4, 'true', 130,318));

  //connections.push(mkConn(b4, b2, '', 211, 365));   // b > 0 → keep multiplying
  connections.push(mkConn(b2, b3, 'false'));        // loop back to check
  connections.push(mkConn(b3, b5, ''));   // b == 0 → set done (comb)
  connections.push(mkConn(b1, b11, ''));        // → done state
  //connections.push(mkConn(b11, b2, ''));  
  connections.push(mkConn(b17, b1, '', 375,29));
  connections.push(mkConn(b11, b2, '' ,221,365));
  connections.push(mkConn(b5, b17, '' ,580,155));
  startBlockId = b1;
  userVars = {x:3, n:4}; //remove later
  simVars = { x:3, n:4, a:0, result:0, done:0 };
  beginSim();
  render(); updateEmptyState(); refreshPanels();
}




// ════════════════════════════════════════════════════════
//  UNDO / REDO
// ════════════════════════════════════════════════════════
function capture() {
  return JSON.parse(JSON.stringify({ blocks, connections, startBlockId, userVars, idCounter, view }));
}
function pushUndo() {
  undoStack.push(capture());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
}
function applySnapshot(snap) {
  blocks = snap.blocks; connections = snap.connections;
  startBlockId = snap.startBlockId; userVars = snap.userVars;
  idCounter = snap.idCounter; view = snap.view;
  selectedId = null; selectedConnId = null;
  revalidateAllBlocks(); render(); updateEmptyState(); renderPanel(); refreshPanels();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(capture());
  applySnapshot(undoStack.pop());
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(capture());
  applySnapshot(redoStack.pop());
}

// ════════════════════════════════════════════════════════
//  VIEW HELPERS
// ════════════════════════════════════════════════════════
function updateViewBox() {
  const w = canvasWrap.clientWidth, h = canvasWrap.clientHeight;
  svgEl.setAttribute('viewBox', `${view.x} ${view.y} ${w/view.scale} ${h/view.scale}`);
}
function screenToWorld(sx, sy) {
  return { x: view.x + sx/view.scale, y: view.y + sy/view.scale };
}
function worldToScreen(wx, wy) {
  return { x: (wx - view.x) * view.scale, y: (wy - view.y) * view.scale };
}
function setZoom(s) {
  const cx = view.x + canvasWrap.clientWidth  / (2*view.scale);
  const cy = view.y + canvasWrap.clientHeight / (2*view.scale);
  view.scale = Math.max(0.2, Math.min(4, s));
  view.x = cx - canvasWrap.clientWidth  / (2*view.scale);
  view.y = cy - canvasWrap.clientHeight / (2*view.scale);
  render();
}
function centerCanvas() {
  if (!blocks.length) { view = {x:0,y:0,scale:1}; render(); return; }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  blocks.forEach(b => {
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x+b.w); maxY = Math.max(maxY, b.y+b.h);
  });
  const pw = canvasWrap.clientWidth, ph = canvasWrap.clientHeight;
  const bw = maxX - minX, bh = maxY - minY;
  const pad = 60;
  view.scale = Math.min(4, Math.max(0.2, Math.min((pw-pad*2)/Math.max(bw,1), (ph-pad*2)/Math.max(bh,1))));
  view.x = minX - pad/view.scale;
  view.y = minY - pad/view.scale;
  render();
}

// ════════════════════════════════════════════════════════
//  BLOCK CREATION
// ════════════════════════════════════════════════════════
function mkConn(from, to, label) {
  return { id:'c'+(idCounter++), from, to, label:label||'', mx:null, my:null, loopOff:null, startAngle:null, endAngle:null };
}
function addBlockAt(type, x, y, name, code) {
  const id = 'b'+(idCounter++);
  const d = DEFAULTS[type];
  blocks.push({ id, type, x, y, w:d.w, h:d.h, name:name||autoName(type), code:code||'' });
  if (type === 'state' && !startBlockId) startBlockId = id;
  return id;
}
function autoName(type) {
  const n = blocks.filter(b=>b.type===type).length;
  return type==='state'?'S'+n : type==='decision'?'D'+n : 'C'+n;
}

// ════════════════════════════════════════════════════════
//  DRAG FROM PALETTE
// ════════════════════════════════════════════════════════
function dragStart(e, type) { e.dataTransfer.setData('blockType', type); }
function dropBlock(e) {
  e.preventDefault();
  const type = e.dataTransfer.getData('blockType');
  if (!type) return;
  pushUndo();
  const r = canvasWrap.getBoundingClientRect();
  const w = screenToWorld(e.clientX - r.left, e.clientY - r.top);
  const d = DEFAULTS[type];
  addBlockAt(type, w.x - d.w/2, w.y - d.h/2, null, '');
  render(); updateEmptyState(); refreshPanels();
}

// ════════════════════════════════════════════════════════
//  GEOMETRY
// ════════════════════════════════════════════════════════
function bCX(b) { return b.x + b.w/2; }
function bCY(b) { return b.y + b.h/2; }
function edgePt(b, tx, ty) {
  const cx=bCX(b), cy=bCY(b), dx=tx-cx, dy=ty-cy;
  if (dx===0 && dy===0) return {x:cx, y:cy};
  if (b.type === 'decision') {
    const t = 0.93 / (Math.abs(dx)/(b.w/2) + Math.abs(dy)/(b.h/2));
    return {x:cx+dx*t, y:cy+dy*t};
  }
  const tx2 = Math.abs(dx)>0 ? (b.w/2)/Math.abs(dx) : 1e9;
  const ty2 = Math.abs(dy)>0 ? (b.h/2)/Math.abs(dy) : 1e9;
  const t = Math.min(tx2,ty2)*0.97;
  return {x:cx+dx*t, y:cy+dy*t};
}

// ════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════
function render() {
  svgEl.innerHTML = '';
  updateViewBox();
  const defs = ns('defs');
  [['norm','#3a4060'],['active','#4f9eff'],['sel','#a78bfa']].forEach(([k,col]) => {
    const m = ns('marker'); setA(m,{id:'arr_'+k,markerWidth:8,markerHeight:8,refX:7,refY:3,orient:'auto'});
    const p = ns('path'); setA(p,{d:'M0,0 L6,3 L0,6',fill:'none',stroke:col,'stroke-width':1.5});
    m.appendChild(p); defs.appendChild(m);
  });
  svgEl.appendChild(defs);
  connections.forEach(drawConn);
  blocks.forEach(drawBlock);
}

// ── Block ─────────────────────────────────────────────
function drawBlock(b) {
  const g   = ns('g');
  const act = activeTrail.has(b.id);
  const sel = selectedId === b.id;
  const dbl = liveDoubleDriverIds.has(b.id);
  const cyc = liveCircularIds.has(b.id);
  const codeErr = liveCodeErrorIds.has(b.id);
  const err = dbl || cyc || codeErr;
  const errCol = '#ff5c5c';
  const isStart = b.id === startBlockId && b.type === 'state';
  const lines = (b.code||'').split('\n');

  const selCol = '#3ecf8e';
  if (b.type === 'state') {
    const hH   = 22;
    const fill  = err?'rgba(255,92,92,.18)': act?'rgba(79,158,255,.22)': sel?'rgba(62,207,142,.12)':'rgba(79,158,255,.07)';
    const stk   = err?errCol: sel?selCol: act?'#4f9eff':'#1e3a5c';
    const sw    = err||act||sel?2:1.5;
    g.appendChild(sv('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:7,fill,stroke:stk,'stroke-width':sw}));
    const hf = err?'rgba(255,92,92,.30)': act?'rgba(79,158,255,.38)': sel?'rgba(62,207,142,.25)':'rgba(79,158,255,.16)';
    g.appendChild(sv('rect',{x:b.x+sw/2,y:b.y+sw/2,width:b.w-sw,height:hH,rx:5,fill:hf,stroke:'none'}));
    g.appendChild(sv('line',{x1:b.x,y1:b.y+hH,x2:b.x+b.w,y2:b.y+hH,stroke:stk,'stroke-width':'0.8'}));
    if (isStart) g.appendChild(txt(b.x+10,    b.y+hH/2, '★', '#3ecf8e', 10, '700'));
    if (dbl)     g.appendChild(txt(b.x+b.w-10, b.y+hH/2, '⚡', errCol,   10, '700'));
    if (cyc)     g.appendChild(txt(b.x+b.w-10, b.y+hH/2, '↺', errCol,   11, '700'));
    g.appendChild(txt(b.x+b.w/2, b.y+hH/2, b.name, labelColor(), 10.5, '600'));
    const bodyH  = b.h - hH;
    const lineH  = Math.max(11, Math.min(14, (bodyH-8) / Math.max(lines.length,1)));
    lines.forEach((line,i) => {
      const ty = b.y + hH + 5 + i*lineH + lineH/2;
      if (ty < b.y+b.h-3) g.appendChild(txt(b.x+b.w/2, ty, clip(line,b.w-12), subLabelColor(), 9.5, '400'));
    });
  } else if (b.type === 'decision') {
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    const pts=`${cx},${b.y} ${b.x+b.w},${cy} ${cx},${b.y+b.h} ${b.x},${cy}`;
    const fill = codeErr?'rgba(255,92,92,.18)': act?'rgba(245,166,35,.22)': sel?'rgba(62,207,142,.12)':'rgba(245,166,35,.07)';
    const stk  = codeErr?errCol: sel?selCol: act?'#f5a623':'#4a3a10';
    g.appendChild(sv('polygon',{points:pts,fill,stroke:stk,'stroke-width':codeErr||act||sel?2:1.5}));
    const nonEmpty = lines.filter(l=>l.trim());
    if (nonEmpty.length) g.appendChild(txt(cx, cy, clip(nonEmpty[0],b.w-28), codeErr?errCol:subLabelColor(), 10, '400'));
    if (codeErr) g.appendChild(txt(cx, b.y+6, '⚠', errCol, 9, '700'));
    g.appendChild(txt(b.x+b.w+9, cy, '', '#f5a623', 9, '600'));
    g.appendChild(txt(cx, b.y+b.h+12, '', '#f5a623', 9, '600'));
  } else {
    const rx   = Math.min(b.h/2, 22);
    const fill  = err?'rgba(255,92,92,.18)': act?'rgba(167,139,250,.22)': sel?'rgba(62,207,142,.12)':'rgba(167,139,250,.07)';
    const stk   = err?errCol: sel?selCol: act?'#a78bfa':'#2e1e5c';
    const sw2   = err||act||sel?2:1.5;
    g.appendChild(sv('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx,fill,stroke:stk,'stroke-width':sw2}));
    const nonEmpty = lines.filter(l=>l.trim());
    const lhO = Math.max(11, Math.min(14, (b.h-8)/Math.max(nonEmpty.length,1)));
    const syO = b.y + (b.h - nonEmpty.length*lhO)/2 + lhO/2;
    nonEmpty.forEach((line,i) => {
      const ty = syO + i*lhO;
      if (ty < b.y+b.h-3) g.appendChild(txt(b.x+b.w/2, ty, clip(line,b.w-12), err?errCol:subLabelColor(), 9.5, '400'));
    });
    if (err && !nonEmpty.length) g.appendChild(txt(b.x+b.w/2, b.y+b.h/2, cyc?'↺':'⚡', errCol, 11, '700'));
    if (err &&  nonEmpty.length) g.appendChild(txt(b.x+b.w-8, b.y+10, cyc?'↺':'⚡', errCol, 10, '700'));
  }

  // Resize handle
  const sz=10;
  const rh = sv('rect',{x:b.x+b.w-sz,y:b.y+b.h-sz,width:sz,height:sz,rx:2,fill:sel?'#2a3050':'transparent',stroke:sel?'#3a4060':'transparent','stroke-width':'0.8',cursor:'nwse-resize'});
  rh.addEventListener('mousedown', e=>{ e.preventDefault(); e.stopPropagation(); startResize(e,b.id); });
  g.appendChild(rh);

  // Connector dots — only when selected
  if (sel) connPts(b).forEach(pt => {
    const c = sv('circle',{cx:pt.x,cy:pt.y,r:6,fill:'var(--bg)',stroke:'#3ecf8e','stroke-width':1.5,cursor:'crosshair'});
    c.addEventListener('mousedown', e=>{ e.stopPropagation(); startConn(e,b.id,pt.x,pt.y); });
    g.appendChild(c);
  });

  g.setAttribute('cursor','move');
  g.addEventListener('mousedown', e => startBlockDrag(e, b.id));
  //g.addEventListener('dblclick',  e => { e.stopPropagation(); pushUndo(); deleteBlock(b.id); });
  g.addEventListener('click',     e => { e.stopPropagation(); selectBlock(b.id); });
  svgEl.appendChild(g);
}

function connPts(b) {
  if (b.type==='decision') {
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    return [{x:cx,y:b.y},{x:b.x+b.w,y:cy},{x:cx,y:b.y+b.h},{x:b.x,y:cy}];
  }
  return [{x:b.x+b.w/2,y:b.y},{x:b.x+b.w,y:b.y+b.h/2},{x:b.x+b.w/2,y:b.y+b.h},{x:b.x,y:b.y+b.h/2}];
}

// ── Connection ────────────────────────────────────────
function drawConn(conn) {
  const from = blocks.find(b=>b.id===conn.from);
  if (!from) return;
  const actC = activeConnTrail.has(conn.id);
  const selC = selectedConnId === conn.id || selectedId === conn.from;
  const stroke = actC?'#4f9eff': selC?'#a78bfa':'#3a4060';
  const marker = 'url(#arr_'+(actC?'active':selC?'sel':'norm')+')';
  const sw     = actC||selC?2:1.5;

  if (conn.from === conn.to) { drawSelfLoop(conn, from, stroke, marker, sw, selC); return; }

  const to = blocks.find(b=>b.id===conn.to);
  if (!to) return;
  const fx=bCX(from), fy=bCY(from);
  const tx=bCX(to),   ty=bCY(to);
  let mx = (conn.mx!==null&&conn.mx!==undefined) ? conn.mx : (fx+tx)/2;
  let my = (conn.my!==null&&conn.my!==undefined) ? conn.my : (fy+ty)/2;

  const ep1 = conn.startAngle!=null
    ? edgePt(from, fx+Math.cos(conn.startAngle)*1000, fy+Math.sin(conn.startAngle)*1000)
    : edgePt(from, mx, my);
  const ep2 = conn.endAngle!=null
    ? edgePt(to, tx+Math.cos(conn.endAngle)*1000, ty+Math.sin(conn.endAngle)*1000)
    : edgePt(to, mx, my);
  const d   = `M ${ep1.x} ${ep1.y} Q ${mx} ${my} ${ep2.x} ${ep2.y}`;

  const path = ns('path'); setA(path,{d,fill:'none',stroke,'stroke-width':sw,'marker-end':marker});
  svgEl.appendChild(path);
  const hit = ns('path'); setA(hit,{d,fill:'none',stroke:'transparent','stroke-width':14,cursor:'pointer'});
  hit.addEventListener('click', e=>{ e.stopPropagation(); selectedConnId=conn.id; selectedId=null; render(); renderConnPanel(conn); });
  svgEl.appendChild(hit);

  if (selC) {
    const mp = sv('circle',{cx:mx,cy:my,r:6,fill:'#a78bfa',stroke:'#a78bfa','stroke-width':1.5,cursor:'grab'});
    mp.addEventListener('mousedown', e=>{ e.stopPropagation(); dragMid(e,conn); });
    svgEl.appendChild(mp);

    // Offset handles 8px outward from block edge so they sit outside the block
    const a1 = Math.atan2(ep1.y - bCY(from), ep1.x - bCX(from));
    const h1x = ep1.x + Math.cos(a1)*8, h1y = ep1.y + Math.sin(a1)*8;
    const a2 = Math.atan2(ep2.y - bCY(to), ep2.x - bCX(to));
    const h2x = ep2.x + Math.cos(a2)*8, h2y = ep2.y + Math.sin(a2)*8;
    const sh = sv('circle',{cx:h1x,cy:h1y,r:7,fill:'#f5a623',stroke:'#f5a623','stroke-width':1.5,cursor:'grab',opacity:0.9});
    sh.addEventListener('mousedown', e=>{ e.stopPropagation(); dragConnStart(e,conn); });
    svgEl.appendChild(sh);
    const eh = sv('circle',{cx:h2x,cy:h2y,r:7,fill:'#f5a623',stroke:'#f5a623','stroke-width':1.5,cursor:'grab',opacity:0.9});
    eh.addEventListener('mousedown', e=>{ e.stopPropagation(); dragConnEnd(e,conn); });
    svgEl.appendChild(eh);
  }

  drawLabel(conn.label, mx, my-14);
}

function drawSelfLoop(conn, b, stroke, marker, sw, sel) {
  const lo = conn.loopOff || {dx:80, dy:-64};
  const cx = bCX(b), cy = bCY(b);
  const lx = cx+lo.dx, ly = cy+lo.dy;
  const ep1 = edgePt(b, lx, b.y-50);
  const ep2 = edgePt(b, b.x+b.w+50, ly);
  const d   = `M ${ep1.x} ${ep1.y} C ${ep1.x} ${ly-20}, ${lx-20} ${ep2.y}, ${ep2.x} ${ep2.y}`;
  const path = ns('path'); setA(path,{d,fill:'none',stroke,'stroke-width':sw,'stroke-dasharray':sel?'':'5 3','marker-end':marker});
  svgEl.appendChild(path);
  const hit = ns('path'); setA(hit,{d,fill:'none',stroke:'transparent','stroke-width':14,cursor:'pointer'});
  hit.addEventListener('click', e=>{ e.stopPropagation(); selectedConnId=conn.id; selectedId=null; render(); renderConnPanel(conn); });
  svgEl.appendChild(hit);
  const hR  = sel?7:5;
  const hnd = sv('circle',{cx:lx,cy:ly,r:hR,fill:sel?'#a78bfa':'var(--bg4)',stroke:sel?'#a78bfa':'#555e80','stroke-width':1.5,cursor:'grab'});
  hnd.addEventListener('mousedown', e=>{ e.stopPropagation(); dragLoop(e,conn,b); });
  svgEl.appendChild(hnd);
  const inf = ns('text'); setA(inf,{x:lx,y:ly-13,'text-anchor':'middle','dominant-baseline':'central',fill:'#555e80','font-size':'17','font-family':"'JetBrains Mono',monospace"});
  inf.textContent='∞'; svgEl.appendChild(inf);
  drawLabel(conn.label, lx+12, ly+4);
}

function drawLabel(label, x, y) {
  if (!label) return;
  const lw = label.length*6.5+10;
  const bg = sv('rect',{x:x-lw/2,y:y-8,width:lw,height:14,rx:3,fill:'var(--bg)',stroke:'none'});
  const t  = ns('text'); setA(t,{x,y,'text-anchor':'middle','dominant-baseline':'central',fill:'#f5a623','font-size':'12','font-weight':'400','font-family':"'JetBrains Mono',monospace"});
  t.textContent = label;
  svgEl.appendChild(bg); svgEl.appendChild(t);
}

// ── Drag midpoint ─────────────────────────────────────
function dragMid(e, conn) {
  e.preventDefault();
  const move = ev => {
    const w = screenToWorld(ev.clientX - canvasWrap.getBoundingClientRect().left, ev.clientY - canvasWrap.getBoundingClientRect().top);
    conn.mx = w.x; conn.my = w.y; render();
  };
  const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function dragConnStart(e, conn) {
  e.preventDefault(); pushUndo();
  const r = canvasWrap.getBoundingClientRect();
  const from = blocks.find(b => b.id === conn.from);
  const move = ev => {
    const w = screenToWorld(ev.clientX-r.left, ev.clientY-r.top);
    if (from) conn.startAngle = Math.atan2(w.y - bCY(from), w.x - bCX(from));
    render();
  };
  const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function dragConnEnd(e, conn) {
  e.preventDefault(); pushUndo();
  const r = canvasWrap.getBoundingClientRect();
  const move = ev => {
    const w = screenToWorld(ev.clientX-r.left, ev.clientY-r.top);
    const nearest = findNearestBlock(w.x, w.y);
    if (nearest) {
      conn.to = nearest.id;
      conn.endAngle = Math.atan2(w.y - bCY(nearest), w.x - bCX(nearest));
    }
    render();
  };
  const up = () => {
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    render(); renderSideEditor(); refreshPanels();
  };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function dragLoop(e, conn, b) {
  e.preventDefault();
  if (!conn.loopOff) conn.loopOff={dx:80,dy:-64};
  const move = ev => {
    const w = screenToWorld(ev.clientX - canvasWrap.getBoundingClientRect().left, ev.clientY - canvasWrap.getBoundingClientRect().top);
    conn.loopOff = { dx:w.x - bCX(b), dy:w.y - bCY(b) }; render();
  };
  const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

// ── Block drag ────────────────────────────────────────
function startBlockDrag(e, id) {
  const cur = e.target.getAttribute('cursor');
  if (cur === 'nwse-resize' || cur === 'crosshair') return;
  e.preventDefault(); e.stopPropagation();
  pushUndo();
  const b  = blocks.find(b=>b.id===id);
  const w0 = screenToWorld(e.clientX - canvasWrap.getBoundingClientRect().left, e.clientY - canvasWrap.getBoundingClientRect().top);
  const ox = w0.x - b.x, oy = w0.y - b.y;
  const move = ev => {
    const r = canvasWrap.getBoundingClientRect();
    const w = screenToWorld(ev.clientX-r.left, ev.clientY-r.top);
    b.x = w.x-ox; b.y = w.y-oy; render();
  };
  const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

// ── Resize ────────────────────────────────────────────
function startResize(e, id) {
  e.preventDefault(); e.stopPropagation(); pushUndo();
  const b = blocks.find(b=>b.id===id);
  const sw = b.w, sh = b.h;
  const sx = e.clientX, sy = e.clientY;
  const move = ev => {
    b.w = Math.max(MIN_W[b.type], sw+(ev.clientX-sx)/view.scale);
    b.h = Math.max(MIN_H[b.type], sh+(ev.clientY-sy)/view.scale);
    render(); if (selectedId===id) renderPanel();
  };
  const up = () => { document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

// ── Connections ───────────────────────────────────────
let connStart=null, connPreview=null, connSnapHighlight=null;
function canAddOutgoingConnection(fromId) {
  const from = blocks.find(b => b.id === fromId);
  if (!from) return false;
  const outCount = connections.filter(c => c.from === fromId).length;
  if (from.type === 'decision') return outCount < 2;
  return outCount === 0;
}
function findNearestBlock(wx, wy) {
  let best = null, bestDist = Infinity;
  blocks.forEach(b => {
    const d = Math.hypot(wx - bCX(b), wy - bCY(b));
    if (d < bestDist) { best = b; bestDist = d; }
  });
  return best;
}
function startConn(e, blockId, cx, cy) {
  e.preventDefault();
  connStart={blockId,cx,cy};
  connPreview = sv('path',{d:`M ${cx} ${cy} L ${cx} ${cy}`,fill:'none',stroke:'#4f9eff','stroke-width':1.8,'marker-end':'url(#arr_active)','pointer-events':'none'});
  svgEl.appendChild(connPreview);
  const move = ev => {
    const r = canvasWrap.getBoundingClientRect();
    const w = screenToWorld(ev.clientX-r.left, ev.clientY-r.top);
    const from = blocks.find(b => b.id === connStart.blockId);
    const ep1 = from ? edgePt(from, w.x, w.y) : {x:connStart.cx, y:connStart.cy};

    const nearest = findNearestBlock(w.x, w.y);
    let ep2x = w.x, ep2y = w.y;
    if (nearest) {
      const angle = Math.atan2(w.y - bCY(nearest), w.x - bCX(nearest));
      const ep2 = edgePt(nearest, bCX(nearest)+Math.cos(angle)*1000, bCY(nearest)+Math.sin(angle)*1000);
      ep2x = ep2.x; ep2y = ep2.y;
    }
    connPreview.setAttribute('d', `M ${ep1.x} ${ep1.y} L ${ep2x} ${ep2y}`);
  };
  const up = ev => {
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    if (connPreview) { svgEl.removeChild(connPreview); connPreview=null; }
    const r = canvasWrap.getBoundingClientRect();
    const w = screenToWorld(ev.clientX-r.left, ev.clientY-r.top);
    const nearest = findNearestBlock(w.x, w.y);
    const target = nearest ? nearest.id : null;
    if (target !== null) {
      if (!canAddOutgoingConnection(connStart.blockId)) {
        alert('State and conditional output boxes can only have one outgoing connection.');
        connStart=null; return;
      }
      pushUndo();
      const conn = mkConn(connStart.blockId, target, autoLabel(connStart.blockId, target));
      conn.endAngle = Math.atan2(w.y - bCY(nearest), w.x - bCX(nearest));
      connections.push(conn);
      render(); refreshPanels();
    }
    connStart=null;
  };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}
function autoLabel(fromId, toId) {
  const from = blocks.find(b=>b.id===fromId);
  if (from&&from.type==='decision') {
    const ex = connections.filter(c=>c.from===fromId);
    if (!ex.some(c=>c.label==='true'))  return 'true';
    if (!ex.some(c=>c.label==='false')) return 'false';
  }
  return '';
}
function findBlockAt(wx, wy) {
  for (let b of [...blocks].reverse()) {
    if (b.type==='decision') {
      if (Math.abs(wx-bCX(b))/(b.w/2)+Math.abs(wy-bCY(b))/(b.h/2)<=1.1) return b.id;
    } else {
      if (wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h) return b.id;
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════
//  SELECT / PANELS
// ════════════════════════════════════════════════════════
function selectBlock(id) {
  selectedId=id; selectedConnId=null;
  renderSideEditor();
  render();
}
function renderSideEditor() {
  const el = document.getElementById('sideEditor');
  if (!el) return;
  if (selectedConnId) { renderConnPanel(connections.find(c=>c.id===selectedConnId)); return; }
  if (!selectedId) {
    el.innerHTML='<div style="color:var(--text3);font-size:17px;padding:8px 0;text-align:center">Click a block to edit</div>';
    return;
  }
  const b = blocks.find(b=>b.id===selectedId); if (!b) return;
  const names={state:'State Box',decision:'Decision Box',output:'Conditional Output'};
  const hints={
    state:   '// Runs each cycle\n// x = x + 1;',
    decision:'// Boolean expression\n// x > 5',
    output:  '// Path assignment\n// result = x * 2;'
  };
  const conns = connections.filter(c=>c.from===b.id);
  const isStart = b.id === startBlockId && b.type === 'state';
  el.innerHTML = `
    <div class="sidebar-label">${names[b.type]}</div>
    ${b.type==='state'?`<button class="btn ${isStart?'active':''}" style="width:100%;margin-bottom:8px;font-size:17px" onclick="setStart('${b.id}')">
      ${isStart?'★ Start state':'☆ Set as start'}
    </button>`:''}
    <div class="editor-section">
      <div class="editor-label">Name</div>
      <input class="editor-input" value="${h(b.name)}" oninput="liveUpdate('name',this.value)" placeholder="Block name">
    </div>
    <div class="editor-section">

function liveUpdate(field, val) {

    blocks.forEach(bl => extractAssignedNames(bl.code, { blockType: bl.type }).forEach(n => stillAssigned.add(n)));

    // Remove from simVars any var that is no longer assigned anywhere
    // AND is not a user-defined input variable
    Object.keys(simVars).forEach(varName => {

    extractAssignedNames(val, { blockType: b.type }).forEach(varName => {

function handleCodeEditorInput(textarea) {
  const b = blocks.find(b => b.id === selectedId);
  if (!b) return;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  let next = textarea.value.replace(/<-/g, '←');
  if (next !== textarea.value) {
    const delta = next.length - textarea.value.length;
    textarea.value = next;
    textarea.setSelectionRange(start + delta, end + delta);
  }
  liveUpdate('code', textarea.value);
  updateCodeValidationDisplay();
}
function validateDecisionCode(code) {
  const errors = [];
  if (!code || !code.trim()) return { valid: true, errors: [] };
  const trimmed = code.trim();

  // Single expression only — no semicolons
  if (trimmed.includes(';')) {
    errors.push('Decision box must contain a single boolean expression, not multiple statements.');
    return { valid: false, errors };
  }

  // Bare identifier: valid only if 1-bit signal
  if (/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(trimmed)) {
    const bits = varBits[trimmed] ?? varBitDefault;
    if (bits !== 1) {
      errors.push(`<code>${h(trimmed)}</code> is a ${bits}-bit signal — only 1-bit signals can be used directly as a condition. Use a relational expression (e.g. <code>${h(trimmed)} != 0</code>).`);
    }
    return { valid: errors.length === 0, errors };
  }

  // Bare assignment: = not preceded by !<>= and not ==
  if (/(?<![!<>=])=(?!=)/.test(trimmed)) {
    errors.push(`<code>${h(trimmed)}</code> looks like an assignment — decision boxes must be boolean expressions only (e.g. <code>a == 0</code>, <code>b > 0</code>).`);
  }

  return { valid: errors.length === 0, errors };
}

function updateCodeValidationDisplay() {
  const b = blocks.find(b => b.id === selectedId);
  if (!b || !['state', 'output', 'decision'].includes(b.type)) return;

  const validation = b.type === 'decision'
    ? validateDecisionCode(b.code)
    : validateAssignmentCode(b.code, b.type);
  const textarea = document.querySelector('#sideEditor textarea');
  if (!textarea) return;
  
  let errorBox = textarea.parentElement.querySelector('.code-error-box');
  if (!errorBox) {
    errorBox = document.createElement('div');
    errorBox.className = 'code-error-box';
    textarea.parentElement.appendChild(errorBox);
  }
  
  const hasCircular = validation.errors.some(e => e.includes('Circular'));
  const wasCircular = liveCircularIds.has(b.id);
  if (hasCircular) liveCircularIds.add(b.id);
  else             liveCircularIds.delete(b.id);

  const hasCodeError = !validation.valid;
  const wasCodeError = liveCodeErrorIds.has(b.id);
  if (hasCodeError) liveCodeErrorIds.add(b.id);
  else              liveCodeErrorIds.delete(b.id);

  if (hasCircular !== wasCircular || hasCodeError !== wasCodeError) render();

  if (!validation.valid && validation.errors.length > 0) {
    errorBox.innerHTML = validation.errors.map(err =>
      `<div class="error-item">• ${err}</div>`
    ).join('');
    errorBox.style.display = 'block';
  } else {
    errorBox.style.display = 'none';
  }
}

// Validate code in state/output boxes. Returns { valid: bool, errors: string[] }
function validateAssignmentCode(code, blockType) {
  const errors = [];
  
  if (!code || !code.trim()) {
    return { valid: true, errors: [] }; // empty is OK
  }

  const statements = splitCodeStatements(code, { blockType });
  
  statements.forEach((stmt, idx) => {
    const lineNum = idx + 1;
    
    // Check if statement looks like a comparison instead of assignment
    if (stmt.match(/==|!=/) || (stmt.match(/<=|>=/) && !stmt.match(/^[A-Za-z_$][A-Za-z0-9_$]*\s*[+\-*&|^]?=/))) {
      errors.push(`Line ${lineNum}: <code>${h(stmt)}</code> is not a valid assignment — use <code>varName = expr</code>. (<code><=</code> is the comparison operator; use <code>=</code> for assignment.)`);
      return;
    }
    
    // Parse assignment
    const parsed = parseAssignmentStatement(stmt);
    
    if (!parsed) {
      // Not a valid assignment
      if (stmt) {
        if (/^[A-Za-z_$][A-Za-z0-9_$]*\s*[=!<>]+/.test(stmt)) {
          errors.push(`Line ${lineNum}: Invalid syntax: <code>${h(stmt)}</code> — use <code>varName = expr;</code>`);
        } else if (!/^[A-Za-z_$]/.test(stmt)) {
          errors.push(`Line ${lineNum}: Must start with variable name: <code>${h(stmt)}</code>`);
        } else {
          errors.push(`Line ${lineNum}: Not a valid assignment: <code>${h(stmt)}</code>`);
        }
      }
      return;
    }
    
    const { lhs, rhs } = parsed;
    
    // Validate LHS
    if (!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(lhs)) {
      errors.push(`Line ${lineNum}: Invalid variable name: <code>${h(lhs)}</code>`);
      return;
    }
    
    // Reject division and modulo operators
    if (/\//.test(rhs) || /%/.test(rhs)) {
      errors.push(`Line ${lineNum}: Operators <code>/</code> and <code>%</code> are not supported — use <code>+</code> <code>-</code> <code>*</code> for arithmetic.`);
    }

    // Check for decimal literals (reject floating point numbers)
    if (/\b\d+\.\d+\b/.test(rhs)) {
      errors.push(`Line ${lineNum}: Decimal numbers not allowed — only integers. Found in <code>${h(rhs)}</code>`);
    }
    
    // Try evaluating RHS to catch expression errors
    try {
      const result = evalExprInScope(rhs, { ...simVars });
      // Check if result is an integer
      if (!Number.isInteger(result)) {
        errors.push(`Line ${lineNum}: Expression <code>${h(rhs)}</code> evaluates to non-integer <code>${result}</code> — only integers allowed`);
      }
    } catch(e) {
      const msg = (e.message || String(e)).replace(/^SyntaxError: /i, '');
      errors.push(`Line ${lineNum}: Invalid expression <code>${h(rhs)}</code> — ${msg}`);
    }

    // Check constant RHS against declared bit width
    try {
      const constVal = evalExprInScope(rhs, {});
      if (Number.isInteger(constVal) && Number.isFinite(constVal)) {
        const bw = varBits[lhs] ?? varBitDefault;
        const half = Math.pow(2, bw - 1);
        if (constVal < -half || constVal > half - 1) {
          errors.push(`Line ${lineNum}: Value <code>${constVal}</code> is out of the ${bw}-bit range [${-half}, ${half-1}] for <code>${h(lhs)}</code>`);
        }
      }
    } catch(e) { /* non-constant RHS — skip static range check */ }
  });
  
  // For output/state boxes: detect circular deps among combinational vars
  if (['output', 'state'].includes(blockType) && errors.length === 0) {
    const combDeps = {};
    statements.forEach(stmt => {
      const parsed = parseAssignmentStatement(stmt);
      if (!parsed || isRegisterVar(parsed.lhs)) return;
      combDeps[parsed.lhs] = (parsed.rhs.match(/\b[A-Za-z_$][A-Za-z0-9_$]*\b/g) || []);
    });
    const combLhs = new Set(Object.keys(combDeps));
    const GRAY = 1, BLACK = 2;
    const color = {};
    let cycleNodes = null;
    const dfs = (u, path) => {
      color[u] = GRAY;
      for (const v of combDeps[u]) {
        if (!combLhs.has(v)) continue;
        if (color[v] === GRAY) {
          const idx = path.indexOf(v);
          cycleNodes = [...path.slice(idx), v];
          return true;
        }
        if (color[v] !== BLACK && dfs(v, [...path, v])) return true;
      }
      color[u] = BLACK;
      return false;
    };
    for (const node of combLhs) {
      if (!color[node] && dfs(node, [node])) break;
    }
    if (cycleNodes) {
      errors.push(`Circular combinational assignment: <code>${cycleNodes.join(' → ')}</code> forms a cycle — combinational logic cannot depend on itself.`);
    }
  }

  return { valid: errors.length === 0, errors };
}

function getVarBase(_k) { return simDisplayBase; }

function formatInBase(val, base, bits) {
  if (typeof val !== 'number' || !Number.isFinite(val)) return String(val);
  const bw = Math.min(bits || varBitDefault, 32);
  const mask = bw === 32 ? 0xFFFFFFFF : (1 << bw) - 1;
  const unsigned = (val & mask) >>> 0;
  if (base === 'hex') {
    const digits = Math.ceil(bw / 4);
    return '0x' + unsigned.toString(16).toUpperCase().padStart(digits, '0');
  }
  if (base === 'bin') return '0b' + unsigned.toString(2).padStart(bw, '0');
  return String(val);
}

function parseInBase(str, base, bits) {
  str = String(str).trim();
  if (!str) return null;
  const bw = Math.min(bits || varBitDefault, 32);
  const mask = bw === 32 ? 0xFFFFFFFF : (1 << bw) - 1;
  const half = Math.pow(2, bw - 1);
  const full = Math.pow(2, bw);
  let n;
  if (base === 'hex') {
    const s = /^0x/i.test(str) ? str : '0x' + str;
    n = parseInt(s, 16);
    if (isNaN(n) || n < 0) return null;
    n = (n & mask) >>> 0;
    if (n >= half) n -= full;
  } else if (base === 'bin') {
    const s = /^0b/i.test(str) ? str.slice(2) : str;
    if (!s || /[^01]/.test(s)) return null;
    n = parseInt(s, 2);
    if (isNaN(n)) return null;
    n = (n & mask) >>> 0;
    if (n >= half) n -= full;
  } else {
    if (str === '-') return null;
    n = parseInt(str, 10);
    if (isNaN(n)) return null;
    if (String(n) !== str && '-' + String(Math.abs(n)) !== str) return null;
  }
  return n;
}
